<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎥 Rekam Video Packing</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f172a;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  background: linear-gradient(135deg, #1a73e8, #4285f4);
  padding: 16px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.header h1 { font-size: 1.1rem; margin-bottom: 4px; }
.header p { font-size: .78rem; opacity: .9; }
.order-info {
  background: #1e293b;
  padding: 10px 16px;
  text-align: center;
  font-size: .85rem;
  border-bottom: 1px solid #334155;
}
.order-info strong { color: #60a5fa; }
.video-wrap {
  flex: 1;
  position: relative;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  min-height: 300px;
}
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
.timer {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(239, 68, 68, .9);
  color: #fff;
  padding: 8px 20px;
  border-radius: 30px;
  font-size: 1rem;
  font-weight: 700;
  display: none;
  align-items: center;
  gap: 8px;
  z-index: 10;
  box-shadow: 0 4px 12px rgba(0,0,0,.4);
}
.timer.show { display: flex; }
.timer .dot {
  width: 10px;
  height: 10px;
  background: #fff;
  border-radius: 50%;
  animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: .3; } }
.status {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(0,0,0,.7);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: .72rem;
  font-weight: 600;
  z-index: 10;
}
.controls {
  background: #1e293b;
  padding: 16px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  padding: 14px 24px;
  border: none;
  border-radius: 12px;
  font-size: .9rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:active { transform: scale(.95); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-rec {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  min-width: 140px;
  justify-content: center;
}
.btn-stop {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #fff;
  min-width: 140px;
  justify-content: center;
}
.btn-download {
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
}
.btn-retry {
  background: #475569;
  color: #fff;
}
.btn-flip {
  background: #475569;
  color: #fff;
  width: 50px;
  height: 50px;
  padding: 0;
  border-radius: 50%;
  font-size: 1.2rem;
  justify-content: center;
}
.preview-info {
  background: #064e3b;
  color: #d1fae5;
  padding: 12px 16px;
  text-align: center;
  font-size: .82rem;
  display: none;
}
.preview-info.show { display: block; }
.preview-info strong { color: #6ee7b7; }
.error-box {
  background: #7f1d1d;
  color: #fee2e2;
  padding: 14px 16px;
  text-align: center;
  font-size: .85rem;
  display: none;
}
.error-box.show { display: block; }
.spinner {
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.format-badge {
  display: inline-block;
  background: rgba(16, 185, 129, .2);
  color: #6ee7b7;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: .7rem;
  font-weight: 600;
  margin-left: 6px;
}
.quality-selector {
  background: #1e293b;
  padding: 10px 16px;
  text-align: center;
  border-bottom: 1px solid #334155;
  display: flex;
  justify-content: center;
  gap: 8px;
  align-items: center;
  font-size: .82rem;
}
.quality-btn {
  background: #334155;
  color: #cbd5e1;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: .75rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.quality-btn.active {
  background: #1a73e8;
  color: #fff;
}
.processing-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  flex-direction: column;
  gap: 16px;
}
.processing-overlay.show { display: flex; }
.processing-overlay .big-spinner {
  width: 60px;
  height: 60px;
  border: 5px solid rgba(255,255,255,.2);
  border-top-color: #60a5fa;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
.processing-overlay p {
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  text-align: center;
}
.processing-overlay small {
  color: #cbd5e1;
  font-size: .82rem;
}
</style>
</head>
<body>

<div class="header">
  <h1>🎥 Rekam Video Packing</h1>
  <p>Tekan tombol REC untuk mulai merekam</p>
</div>

<div class="order-info">
  📦 Order: <strong id="orderName">-</strong>
  <span class="format-badge" id="formatBadge">MP4</span>
</div>

<div class="quality-selector">
  ⚙️ Kualitas:
  <button class="quality-btn" data-q="low" onclick="setQuality('low')">📱 Hemat</button>
  <button class="quality-btn active" data-q="medium" onclick="setQuality('medium')">⚖️ Normal</button>
  <button class="quality-btn" data-q="high" onclick="setQuality('high')">💎 Jernih</button>
</div>

<div class="error-box" id="errorBox"></div>

<div class="video-wrap">
  <video id="preview" autoplay playsinline muted></video>
  <div class="timer" id="timer"><span class="dot"></span><span id="timerText">00:00</span></div>
  <div class="status" id="status">🔄 Memuat kamera...</div>
</div>

<div class="preview-info" id="previewInfo">
  ✅ Video selesai direkam! Klik <strong>Download</strong> lalu pilih file di form web.
</div>

<div class="controls" id="controls">
  <button class="btn btn-flip" id="btnFlip" onclick="flipCamera()" title="Ganti Kamera">🔄</button>
  <button class="btn btn-rec" id="btnRec" onclick="startRec()" disabled>
    <span style="width:12px;height:12px;background:#fff;border-radius:50%;display:inline-block"></span>
    REC
  </button>
</div>

<div class="processing-overlay" id="processingOverlay">
  <div class="big-spinner"></div>
  <p id="processingText">Memproses video...</p>
  <small id="processingSub">Mohon tunggu, jangan tutup halaman</small>
</div>

<script>
var stream = null;
var recorder = null;
var chunks = [];
var startTime = 0;
var timerInterval = null;
var recordedBlob = null;
var currentFacingMode = 'environment';
var mimeType = '';
var fileExtension = '';

// ★ Quality settings ★
var qualityPresets = {
  low:    { width: 640,  height: 480,  bitrate: 600000  }, // 0.6 Mbps
  medium: { width: 1280, height: 720,  bitrate: 1500000 }, // 1.5 Mbps
  high:   { width: 1920, height: 1080, bitrate: 3000000 }  // 3.0 Mbps
};
var currentQuality = 'medium';

var urlParams = new URLSearchParams(window.location.search);
var orderName = urlParams.get('order') || 'video';
document.getElementById('orderName').textContent = orderName;

function setQuality(q) {
  currentQuality = q;
  document.querySelectorAll('.quality-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-q') === q);
  });
  // Restart camera dengan resolusi baru
  if (stream) startCam();
}

function detectMimeType() {
  var candidates = [
    { mime: 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"', ext: 'mp4' },
    { mime: 'video/mp4; codecs="avc1.42E01E"',            ext: 'mp4' },
    { mime: 'video/mp4',                                   ext: 'mp4' },
    { mime: 'video/webm; codecs="h264, opus"',            ext: 'webm' },
    { mime: 'video/webm; codecs="h264"',                  ext: 'webm' },
    { mime: 'video/webm; codecs="vp9, opus"',             ext: 'webm' },
    { mime: 'video/webm; codecs="vp9"',                   ext: 'webm' },
    { mime: 'video/webm; codecs="vp8, opus"',             ext: 'webm' },
    { mime: 'video/webm; codecs="vp8"',                   ext: 'webm' },
    { mime: 'video/webm',                                  ext: 'webm' }
  ];

  for (var i = 0; i < candidates.length; i++) {
    if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(candidates[i].mime)) {
      mimeType = candidates[i].mime;
      fileExtension = candidates[i].ext;
      console.log('✅ Format terpilih:', mimeType);
      return true;
    }
  }
  return false;
}

async function startCam() {
  try {
    document.getElementById('errorBox').classList.remove('show');
    document.getElementById('status').textContent = '🔄 Memuat kamera...';

    if (stream) {
      stream.getTracks().forEach(function(t) { t.stop(); });
    }

    if (!detectMimeType()) {
      throw new Error('Browser tidak mendukung recording video');
    }

    document.getElementById('formatBadge').textContent = fileExtension.toUpperCase();

    var preset = qualityPresets[currentQuality];
    var constraints = {
      video: {
        facingMode: currentFacingMode,
        width:  { ideal: preset.width  },
        height: { ideal: preset.height }
      },
      audio: true
    };

    stream = await navigator.mediaDevices.getUserMedia(constraints);

    var video = document.getElementById('preview');
    video.srcObject = stream;
    video.muted = true;

    document.getElementById('status').textContent = '✅ Siap (' + preset.height + 'p)';
    document.getElementById('btnRec').disabled = false;

  } catch (err) {
    console.error(err);
    var msg = 'Gagal membuka kamera. ';
    if (err.name === 'NotAllowedError')      msg += 'Izinkan akses kamera di browser.';
    else if (err.name === 'NotFoundError')    msg += 'Kamera tidak ditemukan.';
    else if (err.name === 'NotReadableError') msg += 'Kamera sedang dipakai aplikasi lain.';
    else                                       msg += err.message;
    showError(msg);
    document.getElementById('status').textContent = '❌ Error';
  }
}

function showError(msg) {
  var el = document.getElementById('errorBox');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('show');
}

function flipCamera() {
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  startCam();
}

function startRec() {
  if (!stream) { showError('Kamera belum siap'); return; }

  chunks = [];
  recordedBlob = null;
  document.getElementById('previewInfo').classList.remove('show');

  try {
    var preset = qualityPresets[currentQuality];
    
    // ★ Pakai bitrate sesuai quality ★
    var options = {
      mimeType: mimeType,
      videoBitsPerSecond: preset.bitrate,
      audioBitsPerSecond: 128000 // 128 kbps audio
    };

    recorder = new MediaRecorder(stream, options);

    recorder.ondataavailable = function(e) {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };

    recorder.onstop = function() {
      recordedBlob = new Blob(chunks, { type: mimeType });
      showPreview();
    };

    recorder.start(1000);
    startTime = Date.now();
    startTimer();

    document.getElementById('status').textContent = '🔴 Sedang merekam';
    document.getElementById('timer').classList.add('show');

    document.getElementById('controls').innerHTML =
      '<button class="btn btn-stop" onclick="stopRec()">' +
      '<span style="width:12px;height:12px;background:#fff;display:inline-block"></span>' +
      'STOP REKAM</button>';

  } catch (err) {
    console.error(err);
    showError('Gagal memulai recording: ' + err.message);
  }
}

function stopRec() {
  if (recorder && recorder.state !== 'inactive') {
    recorder.stop();
  }
  stopTimer();
  document.getElementById('timer').classList.remove('show');
  document.getElementById('status').textContent = '⏸️ Memproses video...';
}

function startTimer() {
  timerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - startTime) / 1000);
    var mm = Math.floor(elapsed / 60).toString().padStart(2, '0');
    var ss = (elapsed % 60).toString().padStart(2, '0');
    document.getElementById('timerText').textContent = mm + ':' + ss;
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function showPreview() {
  if (!recordedBlob) return;

  if (stream) {
    stream.getTracks().forEach(function(t) { t.stop(); });
  }

  var video = document.getElementById('preview');
  video.srcObject = null;
  video.src = URL.createObjectURL(recordedBlob);
  video.muted = false;
  video.controls = true;
  video.loop = false;

  var sizeMB = (recordedBlob.size / 1048576).toFixed(2);
  document.getElementById('status').textContent = '✅ Selesai (' + sizeMB + ' MB)';
  document.getElementById('previewInfo').classList.add('show');

  document.getElementById('controls').innerHTML =
    '<button class="btn btn-retry" onclick="resetRec()">🔄 Rekam Ulang</button>' +
    '<button class="btn btn-download" onclick="downloadVideo()">💾 Download Video</button>';
}

function downloadVideo() {
  if (!recordedBlob) return;

  var fileName = 'video_' + orderName + '_' + Date.now() + '.' + fileExtension;
  var url = URL.createObjectURL(recordedBlob);

  var a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);

  document.getElementById('previewInfo').innerHTML =
    '✅ <strong>Berhasil download!</strong><br>' +
    '<small>File: ' + fileName + '</small><br>' +
    '<small>Tutup halaman ini lalu pilih file di form web</small>';
}

function resetRec() {
  if (recordedBlob) {
    recordedBlob = null;
    chunks = [];
  }

  var video = document.getElementById('preview');
  video.controls = false;
  video.src = '';

  document.getElementById('previewInfo').classList.remove('show');
  document.getElementById('timerText').textContent = '00:00';

  document.getElementById('controls').innerHTML =
    '<button class="btn btn-flip" id="btnFlip" onclick="flipCamera()" title="Ganti Kamera">🔄</button>' +
    '<button class="btn btn-rec" id="btnRec" onclick="startRec()">' +
    '<span style="width:12px;height:12px;background:#fff;border-radius:50%;display:inline-block"></span>' +
    'REC</button>';

  startCam();
}

function stopCam() {
  if (recorder && recorder.state !== 'inactive') {
    try { recorder.stop(); } catch(e) {}
  }
  if (stream) {
    stream.getTracks().forEach(function(t) { t.stop(); });
  }
  stopTimer();
}

window.addEventListener('load', function() { startCam(); });
window.addEventListener('beforeunload', function() { stopCam(); });
</script>
</body>
</html>
