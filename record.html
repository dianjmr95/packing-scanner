<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rekam Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;flex-shrink:0}
.bar h1{font-size:.9rem}
.xbtn{background:#ef4444;border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:active{transform:scale(.9)}
.cam{flex:1;position:relative;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam video{width:100%;height:100%;object-fit:cover}
.panel{padding:12px 14px;background:#1e293b;flex-shrink:0}
.status{text-align:center;font-size:.85rem;color:#94a3b8;margin-bottom:10px}
.status.ok{color:#10b981;font-weight:600}
.status.err{color:#ef4444;font-weight:600}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 20px;border:none;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-rec{background:#ef4444;color:#fff;min-width:140px;justify-content:center}
.btn-stop{background:#f59e0b;color:#fff}
.btn-ok{background:#10b981;color:#fff}
.btn-no{background:#64748b;color:#fff}
.btn-retry{background:#3b82f6;color:#fff}
.timer{font-size:1.8rem;font-weight:700;color:#ef4444;text-align:center;margin-bottom:10px}
.rec-dot{display:inline-block;width:14px;height:14px;background:#ef4444;border-radius:50%;margin-right:8px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.errbox{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#0f172a;z-index:10;padding:24px;text-align:center;flex-direction:column;align-items:center;justify-content:center}
.errbox.show{display:flex}
.errbox .icon{font-size:3rem;margin-bottom:12px}
.errbox .title{font-size:1rem;font-weight:700;color:#ef4444;margin-bottom:8px}
.errbox .desc{font-size:.85rem;color:#94a3b8;margin-bottom:16px;line-height:1.6}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:.9rem;flex-direction:column;gap:12px}
.spinner{width:30px;height:30px;border:3px solid #334155;border-top-color:#ef4444;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:.85rem;display:none;z-index:100}
.toast.show{display:block}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><h1>🎥 Rekam Video</h1><button class="xbtn" onclick="doClose()">✕</button></div>
  <div class="cam">
    <video id="liveVid" autoplay muted playsinline style="display:none"></video>
    <video id="playVid" controls playsinline style="display:none;width:100%;height:100%;object-fit:contain"></video>
    <div class="errbox" id="errbox"><div class="icon">📷</div><div class="title" id="errT">Error</div><div class="desc" id="errD">-</div><button class="btn btn-retry" onclick="startCam()">🔄 Coba Lagi</button><br><br><button class="btn btn-no" onclick="doClose()">✕ Tutup</button></div>
    <div class="loading" id="loadMsg"><div class="spinner"></div><div>Meminta izin kamera...</div></div>
  </div>
  <div class="panel">
    <div class="timer" id="timer" style="display:none"><span class="rec-dot"></span>00:00</div>
    <div class="status" id="status">Memulai kamera...</div>
    <div class="btns">
      <button class="btn btn-rec" id="btnRec" onclick="doRec()" style="display:none">⏺️ Rekam</button>
      <button class="btn btn-stop" id="btnStop" onclick="doStop()" style="display:none">⏹️ Stop</button>
      <button class="btn btn-ok" id="btnSend" onclick="doSend()" style="display:none">✅ Kirim</button>
      <button class="btn btn-retry" id="btnRetry" onclick="doRetry()" style="display:none">🔄 Ulang</button>
      <button class="btn btn-no" id="btnCancel" onclick="doClose()">✕ Batal</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var stream = null;
var recorder = null;
var chunks = [];
var blob = null;
var timerInterval = null;
var seconds = 0;

function showToast(m) {
  var t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function setStatus(m, c) {
  document.getElementById('status').textContent = m;
  document.getElementById('status').className = 'status' + (c ? ' ' + c : '');
}

function fmtTime(s) {
  return Math.floor(s / 60).toString().padStart(2, '0') + ':' + (s % 60).toString().padStart(2, '0');
}

function startCam() {
  document.getElementById('loadMsg').style.display = 'flex';
  document.getElementById('errbox').classList.remove('show');
  document.getElementById('liveVid').style.display = 'none';
  document.getElementById('playVid').style.display = 'none';

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: true
  }).then(function(s) {
    onCamOK(s);
  }).catch(function() {
    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(function(s) {
      onCamOK(s);
    }).catch(function() {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(function(s) {
        onCamOK(s);
      }).catch(function(err) {
        document.getElementById('loadMsg').style.display = 'none';
        document.getElementById('errT').textContent = err.toString().indexOf('NotAllowed') >= 0 ? '🚫 Izin Ditolak' : '❌ Error';
        document.getElementById('errD').textContent = err.toString().indexOf('NotAllowed') >= 0 ? '🔒 → Camera → Allow' : err.toString();
        document.getElementById('errbox').classList.add('show');
      });
    });
  });
}

function onCamOK(s) {
  stream = s;
  var vid = document.getElementById('liveVid');
  vid.srcObject = s;
  vid.style.display = 'block';
  document.getElementById('loadMsg').style.display = 'none';
  vid.onloadedmetadata = function() {
    vid.play();
    setStatus('Kamera siap. Klik rekam.', '');
    document.getElementById('btnRec').style.display = 'inline-flex';
  };
}

function doRec() {
  chunks = [];
  blob = null;
  var mt = 'video/webm;codecs=vp9,opus';
  if (!MediaRecorder.isTypeSupported(mt)) mt = 'video/webm;codecs=vp8,opus';
  if (!MediaRecorder.isTypeSupported(mt)) mt = 'video/webm';
  if (!MediaRecorder.isTypeSupported(mt)) mt = 'video/mp4';
  try { recorder = new MediaRecorder(stream, { mimeType: mt }); }
  catch (e) { recorder = new MediaRecorder(stream); }

  recorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = function() {
    blob = new Blob(chunks, { type: recorder.mimeType });
    document.getElementById('playVid').src = URL.createObjectURL(blob);
    document.getElementById('playVid').style.display = 'block';
    document.getElementById('liveVid').style.display = 'none';
    clearInterval(timerInterval);
    setStatus('✅ ' + (blob.size / 1048576).toFixed(2) + ' MB | ' + fmtTime(seconds), 'ok');
    document.getElementById('btnStop').style.display = 'none';
    document.getElementById('btnSend').style.display = 'inline-flex';
    document.getElementById('btnRetry').style.display = 'inline-flex';
    document.getElementById('timer').style.display = 'none';
  };

  recorder.start(1000);
  document.getElementById('btnRec').style.display = 'none';
  document.getElementById('btnStop').style.display = 'inline-flex';
  document.getElementById('btnCancel').style.display = 'none';
  setStatus('⏺️ Merekam...', '');
  seconds = 0;
  document.getElementById('timer').style.display = 'block';
  document.getElementById('timer').innerHTML = '<span class="rec-dot"></span>00:00';
  timerInterval = setInterval(function() {
    seconds++;
    document.getElementById('timer').innerHTML = '<span class="rec-dot"></span>' + fmtTime(seconds);
  }, 1000);
}

function doStop() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}

function doRetry() {
  blob = null;
  chunks = [];
  document.getElementById('playVid').style.display = 'none';
  document.getElementById('liveVid').style.display = 'block';
  document.getElementById('btnSend').style.display = 'none';
  document.getElementById('btnRetry').style.display = 'none';
  document.getElementById('btnRec').style.display = 'inline-flex';
  document.getElementById('btnCancel').style.display = 'inline-flex';
  setStatus('Kamera siap.', '');
}

function doSend() {
  if (!blob) return;
  document.getElementById('btnSend').disabled = true;
  document.getElementById('btnSend').textContent = '⏳ Memproses...';
  document.getElementById('btnRetry').style.display = 'none';
  setStatus('⏳ Mengkonversi video...', '');

  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    var maxDirect = 4 * 1024 * 1024;

    if (!window.opener) {
      showToast('⚠️ Tidak bisa kirim');
      document.getElementById('btnSend').disabled = false;
      document.getElementById('btnSend').textContent = '✅ Kirim';
      document.getElementById('btnRetry').style.display = 'inline-flex';
      return;
    }

    if (dataUrl.length <= maxDirect) {
      // Kirim langsung
      setStatus('⏳ Mengirim...', '');
      try {
        window.opener.postMessage({
          source: 'packing-recorder',
          action: 'video-result',
          dataUrl: dataUrl,
          size: blob.size,
          type: blob.type
        }, '*');
        showToast('✅ Video dikirim!');
        stopCam();
        setTimeout(function() { window.close(); }, 800);
      } catch (err) {
        sendChunked(dataUrl);
      }
    } else {
      sendChunked(dataUrl);
    }
  };
  reader.readAsDataURL(blob);
}

function sendChunked(dataUrl) {
  setStatus('⏳ Mengirim (chunks)...', '');
  var chunkSize = 1024 * 1024;
  var totalChunks = Math.ceil(dataUrl.length / chunkSize);

  try {
    window.opener.postMessage({
      source: 'packing-recorder',
      action: 'video-chunk-start',
      totalChunks: totalChunks,
      size: blob.size,
      type: blob.type
    }, '*');
  } catch (err) {
    showToast('⚠️ Gagal kirim');
    document.getElementById('btnSend').disabled = false;
    document.getElementById('btnSend').textContent = '✅ Kirim';
    document.getElementById('btnRetry').style.display = 'inline-flex';
    return;
  }

  var sent = 0;
  function sendNext() {
    if (sent >= totalChunks) {
      try {
        window.opener.postMessage({ source: 'packing-recorder', action: 'video-chunk-end' }, '*');
      } catch (err) {}
      showToast('✅ Video dikirim!');
      stopCam();
      setTimeout(function() { window.close(); }, 800);
      return;
    }
    var start = sent * chunkSize;
    var end = Math.min(start + chunkSize, dataUrl.length);
    setStatus('⏳ Chunk ' + (sent + 1) + '/' + totalChunks, '');
    try {
      window.opener.postMessage({
        source: 'packing-recorder',
        action: 'video-chunk-data',
        index: sent,
        chunk: dataUrl.substring(start, end)
      }, '*');
      sent++;
      setTimeout(sendNext, 50);
    } catch (err) {
      showToast('⚠️ Gagal chunk ' + (sent + 1));
      document.getElementById('btnSend').disabled = false;
      document.getElementById('btnSend').textContent = '✅ Kirim';
      document.getElementById('btnRetry').style.display = 'inline-flex';
    }
  }
  sendNext();
}

function stopCam() {
  if (timerInterval) clearInterval(timerInterval);
  if (recorder && recorder.state !== 'inactive') try { recorder.stop(); } catch (e) {}
  if (stream) { try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch (e) {} stream = null; }
}

function doClose() {
  stopCam();
  try { window.close(); } catch (e) {}
  setTimeout(function() { window.history.back(); }, 300);
}

window.addEventListener('load', function() { startCam(); });
window.addEventListener('beforeunload', function() { stopCam(); });
</script>
</body>
</html>
