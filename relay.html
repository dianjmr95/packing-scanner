<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner HP → PC</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: 'AIzaSyAJGVKRhmMYFGIy07Y5nwvOQlyDDDjN3Xg',
      authDomain: 'packing-scanner-31d3a.firebaseapp.com',
      databaseURL: 'https://packing-scanner-31d3a-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'packing-scanner-31d3a'
    });
    var db = firebase.database();
    var relayParams = new URLSearchParams(location.search);
    var sessionId = relayParams.get('session') || '';
    window.ScannerTransport = {
      title: 'Scanner HP → PC',
      autoClose: false,
      sentTitle: 'Kode berhasil dikirim ke PC',
      successMessage: 'Kode terkirim ke PC',
      send: async function (payload) {
        if (!sessionId) throw new Error('Session scanner tidak ditemukan');
        await db.ref('scans/' + sessionId).set({
          target: payload.target,
          value: payload.value,
          type: payload.type,
          time: Date.now()
        });
        setTimeout(function () { db.ref('scans/' + sessionId).remove(); }, 30000);
      },
      close: function () {
        try { window.close(); } catch (e) {}
        setTimeout(function () { try { history.back(); } catch (e) {} }, 250);
      }
    };
  </script>
</head>
<body>
  <script src="scanner-core.js?v=20260723.3"></script>
</body>
</html>
