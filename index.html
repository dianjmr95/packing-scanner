<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner HD</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    window.ScannerTransport = {
      title: 'Scanner HD',
      autoClose: true,
      successMessage: 'Kode dikirim ke aplikasi',
      send: async function (payload) {
        if (window.opener) {
          window.opener.postMessage({
            source: 'packing-scanner',
            action: 'scan-result',
            target: payload.target,
            value: payload.value,
            type: payload.type
          }, '*');
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(payload.value);
          return;
        }
        window.prompt('Salin kode berikut:', payload.value);
      },
      close: function () {
        try { window.close(); } catch (e) {}
        setTimeout(function () { try { history.back(); } catch (e) {} }, 250);
      }
    };
  </script>
</head>
<body>
  <script src="scanner-core.js?v=20260723.3"></script>
</body>
</html>
