<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📷 Barcode Scanner</title>
<style>
  :root {
    --primary: #7c3aed;
    --success: #10b981;
    --danger: #ef4444;
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .header {
    padding: 14px 20px;
    background: var(--card);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,.1);
    flex-shrink: 0;
  }
  .header h1 { font-size: 1rem; display: flex; align-items: center; gap: 8px; }
  .header .target-badge {
    font-size: .7rem;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 600;
  }
  .target-pesanan { background: rgba(124,58,237,.2); color: #a78bfa; }
  .target-resi { background: rgba(16,185,129,.2); color: #6ee7b7; }
  .target-search { background: rgba(59,130,246,.2); color: #93c5fd; }

  .close-btn {
    background: var(--danger);
    border: none;
    color: #fff;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close-btn:active { transform: scale(.9); }

  /* VIDEO AREA */
  .video-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .video-area video {
    width: 100%; height: 100%; object-fit: cover;
  }

  /* Scan guide overlay */
  .scan-guide {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 260px; height: 180px;
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 16px;
    z-index: 5;
    pointer-events: none;
  }
  .scan-guide .c {
    position: absolute;
    width: 28px; height: 28px;
    border: 3px solid var(--success);
  }
  .scan-guide .c.tl { top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:10px 0 0 0; }
  .scan-guide .c.tr { top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 10px 0 0; }
  .scan-guide .c.bl { bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 10px; }
  .scan-guide .c.br { bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 10px 0; }

  .scan-line {
    position: absolute;
    left: 8%; width: 84%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--success), transparent);
    animation: scanAnim 2s ease-in-out infinite;
    z-index: 6;
    pointer-events: none;
  }
  @keyframes scanAnim { 0% { top: 15%; } 50% { top: 80%; } 100% { top: 15%; } }

  /* Scan success flash */
  .flash {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(16, 185, 129, .3);
    z-index: 10;
    display: none;
    animation: flashAnim .3s;
  }
  .flash.show { display: block; }
  @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* BOTTOM PANEL */
  .bottom-panel {
    padding: 16px 20px;
    background: var(--card);
    border-top: 1px solid rgba(255,255,255,.1);
    flex-shrink: 0;
  }

  .status-msg {
    text-align: center;
    font-size: .88rem;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .status-msg.ok { color: var(--success); font-weight: 600; }
  .status-msg.err { color: var(--danger); font-weight: 600; }

  /* Result box */
  .result-box {
    background: rgba(16,185,129,.1);
    border: 2px solid var(--success);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    margin-bottom: 12px;
    display: none;
  }
  .result-box.show { display: block; }
  .result-box .value {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--success);
    word-break: break-all;
    margin-bottom: 4px;
  }
  .result-box .type {
    font-size: .72rem;
    color: var(--text-dim);
  }

  .btn-row {
    display: flex;
    gap: 8px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    transition: .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-warning { background: #f59e0b; color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,.2); color: var(--text); }

  /* Camera switch */
  .cam-switch {
    position: absolute;
    bottom: 16px;
    right: 16px;
    background: rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff;
    width: 48px; height: 48px;
    border-radius: 50%;
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 8;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cam-switch:active { background: rgba(0,0,0,.8); }

  /* Error panel */
  .error-panel {
    display: none;
    text-align: center;
    padding: 40px 24px;
    color: var(--text);
  }
  .error-panel.show { display: block; }
  .error-panel .icon { font-size: 3.5rem; margin-bottom: 16px; }
  .error-panel .title { font-size: 1.1rem; font-weight: 700; color: var(--danger); margin-bottom: 8px; }
  .error-panel .desc { font-size: .85rem; color: var(--text-dim); margin-bottom: 20px; line-height: 1.7; }
  .error-panel .steps {
    text-align: left;
    font-size: .82rem;
    color: var(--text-dim);
    line-height: 2;
    margin-bottom: 20px;
    padding-left: 24px;
  }

  /* Copied toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--success);
    color: #fff;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: .88rem;
    display: none;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  .toast.show { display: block; animation: toastIn .3s; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  @media (max-width: 400px) {
    .scan-guide { width: 200px; height: 140px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    📷 Scanner
    <span class="target-badge" id="targetBadge">No. Pesanan</span>
  </h1>
  <button class="close-btn" onclick="closePage()">✕</button>
</div>

<div class="video-area" id="videoArea">
  <video id="video" autoplay muted playsinline></video>
  <div class="scan-guide" id="scanGuide">
    <div class="c tl"></div><div class="c tr"></div>
    <div class="c bl"></div><div class="c br"></div>
  </div>
  <div class="scan-line" id="scanLine"></div>
  <div class="flash" id="flash"></div>
  <button class="cam-switch" id="camSwitch" onclick="switchCamera()">🔄</button>

  <!-- Error Panel -->
  <div class="error-panel" id="errorPanel">
    <div class="icon">📷</div>
    <div class="title" id="errTitle">Izin Kamera Diperlukan</div>
    <div class="desc" id="errDesc">Browser memerlukan izin untuk mengakses kamera.</div>
    <div class="steps" id="errSteps"></div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;">
      <button class="btn btn-success" onclick="retryCamera()" style="max-width:250px;">🔄 Izinkan & Coba Lagi</button>
      <button class="btn btn-outline" onclick="closePage()" style="max-width:250px;">✕ Kembali</button>
    </div>
  </div>
</div>

<div class="bottom-panel">
  <div class="status-msg" id="statusMsg">Meminta izin kamera...</div>
  <div class="result-box" id="resultBox">
    <div class="type" id="resType">-</div>
    <div class="value" id="resValue">-</div>
  </div>
  <div class="btn-row" id="btnRow" style="display:none;">
    <button class="btn btn-success" onclick="sendResult()">✅ Kirim</button>
    <button class="btn btn-warning" onclick="rescan()">🔄 Ulang</button>
    <button class="btn btn-danger" onclick="closePage()">✕</button>
  </div>
</div>

<div class="toast" id="toast">✅ Kode dikirim!</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
// ============================================
// GET URL PARAMETERS
// ============================================
var params = new URLSearchParams(window.location.search);
var scanTarget = params.get('target') || 'pesanan';  // pesanan, resi, search
var scanType = params.get('type') || 'barcode';       // barcode, qrcode
var callbackOrigin = params.get('origin') || '';       // origin of GAS page
var gasWindowRef = null;

// ============================================
// UI SETUP
// ============================================
var badge = document.getElementById('targetBadge');
if (scanTarget === 'pesanan') {
  badge.textContent = '📋 No. Pesanan';
  badge.className = 'target-badge target-pesanan';
} else if (scanTarget === 'resi') {
  badge.textContent = '🚚 No. Resi';
  badge.className = 'target-badge target-resi';
} else {
  badge.textContent = '🔍 Pencarian';
  badge.className = 'target-badge target-search';
}

// ============================================
// CAMERA VARIABLES
// ============================================
var stream = null;
var scanning = false;
var animFrame = null;
var lastResult = '';
var facingMode = 'environment';
var audioCtx = null;

// ============================================
// AUDIO
// ============================================
function beep(f, d) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = f || 1200;
    g.gain.setValueAtTime(.4, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + (d || 200) / 1000);
    o.start(); o.stop(audioCtx.currentTime + (d || 200) / 1000);
  } catch(e) {}
}
function beepOK() { beep(1200, 150); setTimeout(function() { beep(1600, 200); }, 180); }
function vib() { try { if (navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch(e) {} }

// ============================================
// START CAMERA
// ============================================
function startCamera() {
  document.getElementById('statusMsg').textContent = '⏳ Meminta izin kamera...';
  document.getElementById('statusMsg').className = 'status-msg';

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('Browser Tidak Support', 'Browser ini tidak mendukung akses kamera.', [
      'Gunakan Google Chrome terbaru',
      'Pastikan HTTPS (bukan HTTP)'
    ]);
    return;
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }
  })
  .then(function(s) {
    stream = s;
    var video = document.getElementById('video');
    video.srcObject = s;
    video.style.display = 'block';
    document.getElementById('errorPanel').classList.remove('show');
    document.getElementById('scanGuide').style.display = 'block';
    document.getElementById('scanLine').style.display = 'block';

    video.onloadedmetadata = function() {
      video.play();
      scanning = true;
      document.getElementById('statusMsg').textContent = '📷 Arahkan kamera ke barcode / QR code...';
      startDetection(video);
    };
  })
  .catch(function(err) {
    console.log('Camera error:', err.name, err.message);
    
    if (err.name === 'NotAllowedError') {
      showError('🚫 Izin Kamera Ditolak', 'Anda perlu mengizinkan akses kamera.', [
        'Klik ikon 🔒 di address bar',
        'Cari "Camera" → pilih "Allow"',
        'Klik tombol "Izinkan & Coba Lagi" di bawah'
      ]);
    } else if (err.name === 'NotFoundError') {
      showError('📷 Kamera Tidak Ditemukan', 'Perangkat tidak memiliki kamera.', [
        'Pastikan perangkat ada kamera',
        'Coba di HP dengan kamera'
      ]);
    } else if (err.name === 'NotReadableError') {
      showError('⚠️ Kamera Sibuk', 'Kamera sedang digunakan aplikasi lain.', [
        'Tutup aplikasi lain yang pakai kamera',
        'Coba lagi'
      ]);
    } else {
      // Fallback: coba kamera depan
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(function(s) {
          stream = s;
          facingMode = 'user';
          var video = document.getElementById('video');
          video.srcObject = s;
          video.style.display = 'block';
          document.getElementById('errorPanel').classList.remove('show');
          document.getElementById('scanGuide').style.display = 'block';
          document.getElementById('scanLine').style.display = 'block';
          video.onloadedmetadata = function() {
            video.play(); scanning = true;
            document.getElementById('statusMsg').textContent = '📷 Arahkan ke barcode/QR...';
            startDetection(video);
          };
        })
        .catch(function() {
          showError('❌ Error: ' + err.name, err.message, [
            'Refresh halaman',
            'Coba browser Chrome terbaru'
          ]);
        });
    }
  });
}

function showError(title, desc, steps) {
  document.getElementById('video').style.display = 'none';
  document.getElementById('scanGuide').style.display = 'none';
  document.getElementById('scanLine').style.display = 'none';
  document.getElementById('errTitle').textContent = title;
  document.getElementById('errDesc').textContent = desc;
  var html = '';
  for (var i = 0; i < steps.length; i++) html += '<div>' + (i + 1) + '. ' + steps[i] + '</div>';
  document.getElementById('errSteps').innerHTML = html;
  document.getElementById('errorPanel').classList.add('show');
  document.getElementById('statusMsg').textContent = '❌ Kamera tidak tersedia';
  document.getElementById('statusMsg').className = 'status-msg err';
}

function retryCamera() {
  document.getElementById('errorPanel').classList.remove('show');
  startCamera();
}

function switchCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  stopStream();
  lastResult = '';
  startCamera();
}

function stopStream() {
  scanning = false;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  if (stream) {
    try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch(e) {}
    stream = null;
  }
}

// ============================================
// BARCODE DETECTION
// ============================================
function startDetection(video) {
  if (!('BarcodeDetector' in window)) {
    document.getElementById('statusMsg').textContent = '⚠️ Browser tidak support auto-scan. Gunakan Chrome Android terbaru.';
    document.getElementById('statusMsg').className = 'status-msg err';
    return;
  }

  var formats;
  if (scanType === 'qrcode') {
    formats = ['qr_code'];
  } else {
    formats = ['code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar','qr_code'];
  }

  var detector;
  try { detector = new BarcodeDetector({ formats: formats }); }
  catch(e) { detector = new BarcodeDetector(); }

  function loop() {
    if (!scanning) return;
    detector.detect(video).then(function(codes) {
      if (codes.length > 0 && codes[0].rawValue !== lastResult) {
        lastResult = codes[0].rawValue;
        onDetected(codes[0].rawValue, codes[0].format);
      } else {
        animFrame = requestAnimationFrame(loop);
      }
    }).catch(function() {
      animFrame = requestAnimationFrame(loop);
    });
  }
  loop();
}

// ============================================
// ON DETECTED
// ============================================
function onDetected(value, format) {
  scanning = false;
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }

  beepOK(); vib();

  // Flash effect
  var flash = document.getElementById('flash');
  flash.classList.remove('show');
  void flash.offsetWidth; // force reflow
  flash.classList.add('show');
  setTimeout(function() { flash.classList.remove('show'); }, 300);

  var typeLabel = format === 'qr_code' ? 'QR Code' : 'Barcode (' + format + ')';

  document.getElementById('resValue').textContent = value;
  document.getElementById('resType').textContent = typeLabel;
  document.getElementById('resultBox').classList.add('show');
  document.getElementById('btnRow').style.display = 'flex';
  document.getElementById('statusMsg').textContent = '✅ Berhasil scan!';
  document.getElementById('statusMsg').className = 'status-msg ok';
  document.getElementById('scanGuide').style.display = 'none';
  document.getElementById('scanLine').style.display = 'none';
}

// ============================================
// SEND RESULT BACK TO GAS
// ============================================
function sendResult() {
  var value = document.getElementById('resValue').textContent;
  var type = document.getElementById('resType').textContent;

  // Method 1: postMessage to opener window
  if (window.opener) {
    try {
      window.opener.postMessage({
        source: 'packing-scanner',
        action: 'scan-result',
        target: scanTarget,
        value: value,
        type: type
      }, '*');
      showToast('✅ Kode dikirim!');
      setTimeout(function() { window.close(); }, 800);
      return;
    } catch(e) {}
  }

  // Method 2: Copy to clipboard + show instruction
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(function() {
      showToast('📋 Kode disalin! Paste di form utama.');
      setTimeout(function() { window.close(); }, 1500);
    }).catch(function() {
      fallbackCopy(value);
    });
  } else {
    fallbackCopy(value);
  }
}

function fallbackCopy(value) {
  // Fallback copy
  var ta = document.createElement('textarea');
  ta.value = value;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('📋 Kode disalin! Paste di form utama.');
  } catch(e) {
    showToast('Kode: ' + value + ' — Salin manual');
  }
  document.body.removeChild(ta);
  setTimeout(function() { window.close(); }, 2000);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function rescan() {
  lastResult = '';
  scanning = true;
  document.getElementById('resultBox').classList.remove('show');
  document.getElementById('btnRow').style.display = 'none';
  document.getElementById('statusMsg').textContent = '📷 Arahkan ke barcode/QR...';
  document.getElementById('statusMsg').className = 'status-msg';
  document.getElementById('scanGuide').style.display = 'block';
  document.getElementById('scanLine').style.display = 'block';

  var video = document.getElementById('video');
  if (video.srcObject) startDetection(video);
}

function closePage() {
  stopStream();
  if (window.opener) {
    try { window.close(); } catch(e) {}
  }
  // Fallback jika tidak bisa close
  window.history.back();
}

// ============================================
// INIT
// ============================================
window.addEventListener('load', function() {
  // Simpan referensi window GAS
  gasWindowRef = window.opener;
  startCamera();
});

// Cleanup saat halaman ditutup
window.addEventListener('beforeunload', function() {
  stopStream();
});
</script>
</body>
</html>
