<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;flex-shrink:0}
.bar h1{font-size:.9rem}
.badge{font-size:.65rem;padding:3px 8px;border-radius:16px;font-weight:600;margin-left:6px}
.bp{background:rgba(124,58,237,.2);color:#a78bfa}
.br{background:rgba(16,185,129,.2);color:#6ee7b7}
.bs{background:rgba(59,130,246,.2);color:#93c5fd}
.xbtn{background:#ef4444;border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:active{transform:scale(.9)}

.cam{flex:1;position:relative;background:#000;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover}

/* Library scanner container */
#libReader{width:100%!important;height:100%!important;border:none!important;position:absolute;top:0;left:0}
#libReader video{width:100%!important;height:100%!important;object-fit:cover!important}
#libReader img[alt="Info icon"],#libReader__header_message,#libReader__status_span{display:none!important}
#libReader__dashboard{position:absolute!important;bottom:0!important;left:0!important;right:0!important;background:rgba(0,0,0,.75)!important;padding:6px 8px!important;z-index:5;max-height:50px;overflow:hidden}
#libReader__dashboard button{background:#10b981!important;color:#fff!important;border:none!important;padding:5px 10px!important;border-radius:6px!important;font-weight:600!important;font-size:.72rem!important}
#libReader__dashboard select{background:#333!important;color:#fff!important;border:1px solid #555!important;padding:4px 6px!important;border-radius:4px!important;font-size:.72rem!important}
#libReader__dashboard span,#libReader__dashboard a{color:#ccc!important;font-size:.68rem!important}
#libReader__scan_region{min-height:80px!important;overflow:hidden!important}
#libReader__scan_region img{display:none!important}

.panel{padding:12px 14px;background:#1e293b;flex-shrink:0}
.status{text-align:center;font-size:.85rem;color:#94a3b8;margin-bottom:8px}
.status.ok{color:#10b981;font-weight:600}
.status.err{color:#ef4444;font-weight:600}
.result{background:rgba(16,185,129,.1);border:2px solid #10b981;border-radius:10px;padding:12px;text-align:center;margin-bottom:8px;display:none}
.result.show{display:block}
.result .val{font-size:1.1rem;font-weight:700;color:#10b981;word-break:break-all}
.result .typ{font-size:.7rem;color:#94a3b8;margin-top:4px}
.btns{display:flex;gap:6px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-ok{background:#10b981;color:#fff}
.btn-warn{background:#f59e0b;color:#fff}
.btn-no{background:#ef4444;color:#fff}
.tips{font-size:.72rem;color:#64748b;text-align:center;padding:6px;line-height:1.4}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:.85rem;display:none;z-index:100}
.toast.show{display:block}

.errbox{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#0f172a;z-index:10;padding:24px;text-align:center;flex-direction:column;align-items:center;justify-content:center}
.errbox.show{display:flex}
.errbox .icon{font-size:3rem;margin-bottom:12px}
.errbox .title{font-size:1rem;font-weight:700;color:#ef4444;margin-bottom:8px}
.errbox .desc{font-size:.85rem;color:#94a3b8;margin-bottom:16px;line-height:1.6}

.loading{display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:.9rem;flex-direction:column;gap:12px}
.spinner{width:30px;height:30px;border:3px solid #334155;border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.mode-badge{position:absolute;top:8px;left:8px;z-index:6;font-size:.65rem;padding:4px 10px;border-radius:16px;font-weight:600;background:rgba(0,0,0,.6);color:#94a3b8;backdrop-filter:blur(4px)}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>📷 Scanner <span class="badge" id="badge">-</span></h1>
    <button class="xbtn" onclick="doClose()">✕</button>
  </div>

  <div class="cam" id="camArea">
    <!-- Native mode: video element -->
    <video id="vid" autoplay muted playsinline style="display:none"></video>
    
    <!-- Library mode: div container -->
    <div id="libReader" style="display:none"></div>
    
    <!-- Mode indicator -->
    <div class="mode-badge" id="modeBadge"></div>

    <div class="errbox" id="errbox">
      <div class="icon">📷</div>
      <div class="title" id="errT">Kamera Error</div>
      <div class="desc" id="errD">Tidak bisa mengakses kamera</div>
      <button class="btn btn-ok" onclick="init()" style="max-width:200px;margin-bottom:8px">🔄 Coba Lagi</button>
      <button class="btn btn-no" onclick="doClose()" style="max-width:200px">✕ Tutup</button>
    </div>

    <div class="loading" id="loadMsg">
      <div class="spinner"></div>
      <div id="loadText">Memulai scanner...</div>
    </div>
  </div>

  <div class="panel">
    <div class="status" id="status">Memulai...</div>
    <div class="tips" id="tips">💡 Dekatkan kamera ke barcode. Pastikan terlihat jelas.</div>
    <div class="result" id="resBox">
      <div class="typ" id="resTyp">-</div>
      <div class="val" id="resVal">-</div>
    </div>
    <div class="btns" id="btns" style="display:none">
      <button class="btn btn-ok" onclick="doSend()">✅ Kirim</button>
      <button class="btn btn-warn" onclick="doRescan()">🔄 Ulang</button>
      <button class="btn btn-no" onclick="doClose()">✕</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====================================================
// CONFIG
// ====================================================
var params = new URLSearchParams(location.search);
var scanTarget = params.get('target') || 'pesanan';
var scanType = params.get('type') || 'barcode';

var bdg = document.getElementById('badge');
if (scanTarget === 'resi') { bdg.textContent = '🚚 Resi'; bdg.className = 'badge br'; }
else if (scanTarget === 'search') { bdg.textContent = '🔍 Cari'; bdg.className = 'badge bs'; }
else { bdg.textContent = '📋 Pesanan'; bdg.className = 'badge bp'; }

// ====================================================
// VARIABLES
// ====================================================
var video = document.getElementById('vid');
var stream = null;
var detector = null;
var scanning = false;
var lastResult = '';
var animId = null;
var audioCtx = null;
var scanMode = 'none'; // 'native' or 'library'
var libScanner = null;
var libLoaded = false;

// ====================================================
// AUDIO
// ====================================================
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g);
    g.connect(audioCtx.destination);
    o.frequency.value = 1200;
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.start();
    o.stop(audioCtx.currentTime + 0.15);
    setTimeout(function() {
      var o2 = audioCtx.createOscillator();
      var g2 = audioCtx.createGain();
      o2.connect(g2);
      g2.connect(audioCtx.destination);
      o2.frequency.value = 1600;
      g2.gain.setValueAtTime(0.3, audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      o2.start();
      o2.stop(audioCtx.currentTime + 0.2);
    }, 180);
  } catch (e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

function setLoad(msg) {
  document.getElementById('loadMsg').style.display = 'flex';
  document.getElementById('loadText').textContent = msg;
}

function hideLoad() {
  document.getElementById('loadMsg').style.display = 'none';
}

// ====================================================
// DETECT MODE: Native vs Library
// ====================================================
function hasBarcodeDetector() {
  return ('BarcodeDetector' in window);
}

// ====================================================
// INIT
// ====================================================
function init() {
  document.getElementById('errbox').classList.remove('show');
  
  if (hasBarcodeDetector()) {
    // Android Chrome → pakai native BarcodeDetector
    scanMode = 'native';
    document.getElementById('modeBadge').textContent = '⚡ Native Scanner';
    startNative();
  } else {
    // PC Chrome / Firefox → pakai html5-qrcode library
    scanMode = 'library';
    document.getElementById('modeBadge').textContent = '📦 Library Scanner';
    startLibrary();
  }
}

// ====================================================
// MODE 1: NATIVE BarcodeDetector (Android)
// ====================================================
function startNative() {
  setLoad('Meminta izin kamera...');
  video.style.display = 'none';

  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { min: 640, ideal: 1920 },
      height: { min: 480, ideal: 1080 }
    },
    audio: false
  })
  .then(function(s) {
    stream = s;
    video.srcObject = s;
    video.style.display = 'block';
    hideLoad();

    video.onloadedmetadata = function() {
      video.play();
      setStatus('📷 Arahkan ke barcode / QR code...', '');

      // Auto focus
      try {
        var track = s.getVideoTracks()[0];
        var cap = track.getCapabilities();
        if (cap.focusMode && cap.focusMode.indexOf('continuous') >= 0) {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch (e) {}

      nativeScan();
    };
  })
  .catch(function(err) {
    // Fallback front camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
    .then(function(s) {
      stream = s;
      video.srcObject = s;
      video.style.display = 'block';
      hideLoad();
      video.onloadedmetadata = function() {
        video.play();
        setStatus('📷 Arahkan ke barcode/QR...', '');
        nativeScan();
      };
    })
    .catch(function() {
      showCamError(err);
    });
  });
}

function nativeScan() {
  scanning = true;
  lastResult = '';

  var formats;
  if (scanType === 'qrcode') {
    formats = ['qr_code'];
  } else {
    formats = ['qr_code', 'code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar'];
  }

  try {
    detector = new BarcodeDetector({ formats: formats });
  } catch (e) {
    detector = new BarcodeDetector();
  }

  function loop() {
    if (!scanning) return;
    if (video.readyState < 2) {
      animId = requestAnimationFrame(loop);
      return;
    }
    detector.detect(video)
      .then(function(codes) {
        if (codes.length > 0 && codes[0].rawValue && codes[0].rawValue !== lastResult) {
          lastResult = codes[0].rawValue;
          onFound(codes[0].rawValue, codes[0].format);
          return;
        }
        animId = requestAnimationFrame(loop);
      })
      .catch(function() {
        animId = requestAnimationFrame(loop);
      });
  }
  loop();
}

// ====================================================
// MODE 2: html5-qrcode Library (PC)
// ====================================================
function startLibrary() {
  setLoad('Memuat library scanner...');

  if (libLoaded) {
    initLibScanner();
    return;
  }

  // Load library dinamis
  var script = document.createElement('script');
  script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  script.onload = function() {
    libLoaded = true;
    initLibScanner();
  };
  script.onerror = function() {
    // Coba CDN alternatif
    var script2 = document.createElement('script');
    script2.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    script2.onload = function() {
      libLoaded = true;
      initLibScanner();
    };
    script2.onerror = function() {
      hideLoad();
      showCamError({ toString: function() { return 'Gagal memuat library scanner. Periksa koneksi internet.'; } });
    };
    document.head.appendChild(script2);
  };
  document.head.appendChild(script);
}

function initLibScanner() {
  setLoad('Meminta izin kamera...');

  // Hide native video, show lib container
  video.style.display = 'none';
  var libEl = document.getElementById('libReader');
  libEl.style.display = 'block';
  libEl.innerHTML = '';

  // Cleanup previous
  if (libScanner) {
    try {
      libScanner.stop().then(function() {
        try { libScanner.clear(); } catch(e) {}
        doLibStart();
      }).catch(function() {
        try { libScanner.clear(); } catch(e) {}
        doLibStart();
      });
    } catch (e) {
      doLibStart();
    }
  } else {
    doLibStart();
  }
}

function doLibStart() {
  libScanner = new Html5Qrcode('libReader');

  var fmts = getLibFormats();

  var config = {
    fps: 15,
    qrbox: function(vw, vh) {
      var m = Math.min(vw, vh);
      var s = Math.floor(m * 0.75);
      s = Math.max(120, Math.min(s, 350));
      if (scanType === 'barcode') {
        return { width: s, height: Math.max(80, Math.floor(s * 0.4)) };
      }
      return { width: s, height: Math.max(100, Math.floor(s * 0.85)) };
    },
    formatsToSupport: fmts,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  };

  libScanner.start(
    { facingMode: 'environment' },
    config,
    onLibScan,
    function() {}
  ).then(function() {
    hideLoad();
    setStatus('📷 Arahkan ke barcode / QR code...', '');
    scanning = true;
  }).catch(function(err) {
    // Try front camera
    libScanner.start(
      { facingMode: 'user' },
      config,
      onLibScan,
      function() {}
    ).then(function() {
      hideLoad();
      setStatus('📷 Arahkan ke barcode/QR...', '');
      scanning = true;
    }).catch(function(err2) {
      hideLoad();
      showCamError(err);
    });
  });
}

function getLibFormats() {
  if (typeof Html5QrcodeSupportedFormats === 'undefined') return undefined;
  if (scanType === 'qrcode') return [Html5QrcodeSupportedFormats.QR_CODE];
  return [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.CODABAR
  ];
}

function onLibScan(text, result) {
  if (!scanning) return;
  if (text === lastResult) return;
  lastResult = text;
  scanning = false;

  try { libScanner.pause(true); } catch (e) {}

  var fmt = 'Barcode';
  try { fmt = result.result.format.formatName; } catch (e) {}
  var typeLabel = (fmt === 'QR_CODE') ? 'QR Code' : 'Barcode (' + fmt + ')';

  onFound(text, typeLabel);
}

// ====================================================
// CAMERA ERROR
// ====================================================
function showCamError(err) {
  hideLoad();
  var msg = err.toString();
  var title = '❌ Kamera Error';
  var desc = 'Tidak bisa mengakses kamera.';

  if (msg.indexOf('NotAllowed') >= 0 || msg.indexOf('Permission') >= 0) {
    title = '🚫 Izin Ditolak';
    desc = 'Klik ikon 🔒 di address bar → Camera → Allow → Coba Lagi';
  } else if (msg.indexOf('NotFound') >= 0) {
    title = '📷 Tidak Ada Kamera';
    desc = 'Perangkat tidak memiliki kamera atau webcam.';
  } else if (msg.indexOf('NotReadable') >= 0) {
    title = '⚠️ Kamera Sibuk';
    desc = 'Tutup aplikasi/tab lain yang menggunakan kamera.';
  } else if (msg.indexOf('Gagal memuat') >= 0) {
    title = '📦 Library Error';
    desc = msg;
  }

  document.getElementById('errT').textContent = title;
  document.getElementById('errD').textContent = desc;
  document.getElementById('errbox').classList.add('show');
  setStatus('❌ Kamera tidak tersedia', 'err');
}

// ====================================================
// ON BARCODE FOUND (both modes)
// ====================================================
function onFound(value, format) {
  scanning = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }

  beep();
  try { if (navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch (e) {}

  // Format label
  var typeLabel;
  if (typeof format === 'string') {
    if (format === 'qr_code' || format === 'QR_CODE') {
      typeLabel = 'QR Code';
    } else if (format.indexOf('Barcode') >= 0 || format.indexOf('QR') >= 0) {
      typeLabel = format; // already formatted from library
    } else {
      typeLabel = 'Barcode (' + format + ')';
    }
  } else {
    typeLabel = 'Barcode';
  }

  document.getElementById('resVal').textContent = value;
  document.getElementById('resTyp').textContent = typeLabel;
  document.getElementById('resBox').classList.add('show');
  document.getElementById('btns').style.display = 'flex';
  document.getElementById('tips').style.display = 'none';
  setStatus('✅ Berhasil scan!', 'ok');
}

// ====================================================
// ACTIONS
// ====================================================
function doSend() {
  var value = document.getElementById('resVal').textContent;
  var type = document.getElementById('resTyp').textContent;

  if (window.opener) {
    try {
      window.opener.postMessage({
        source: 'packing-scanner',
        action: 'scan-result',
        target: scanTarget,
        value: value,
        type: type
      }, '*');
      showToast('✅ Kode dikirim!');
      stopAll();
      setTimeout(function() { window.close(); }, 800);
      return;
    } catch (e) {}
  }

  // Fallback: copy
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(function() {
      showToast('📋 Disalin! Paste di form.');
      setTimeout(function() { try { window.close(); } catch(e) {} }, 1500);
    }).catch(function() { prompt('Salin kode:', value); });
  } else {
    prompt('Salin kode:', value);
  }
}

function doRescan() {
  lastResult = '';
  document.getElementById('resBox').classList.remove('show');
  document.getElementById('btns').style.display = 'none';
  document.getElementById('tips').style.display = 'block';
  setStatus('📷 Arahkan ke barcode/QR...', '');

  if (scanMode === 'native') {
    nativeScan();
  } else if (scanMode === 'library') {
    scanning = true;
    try { libScanner.resume(); } catch (e) { initLibScanner(); }
  }
}

function stopAll() {
  scanning = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }

  // Stop native stream
  if (stream) {
    try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch (e) {}
    stream = null;
  }
  video.srcObject = null;

  // Stop library scanner
  if (libScanner) {
    try { libScanner.stop().then(function() { libScanner.clear(); }).catch(function() {}); } catch (e) {}
  }
}

function doClose() {
  stopAll();
  try { window.close(); } catch (e) {}
  setTimeout(function() { window.history.back(); }, 300);
}

// ====================================================
// INIT
// ====================================================
window.addEventListener('load', function() {
  init();
});

window.addEventListener('beforeunload', function() {
  stopAll();
});
</script>
</body>
</html>
