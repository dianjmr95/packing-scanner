<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;flex-shrink:0}
.bar h1{font-size:.9rem}
.badge{font-size:.65rem;padding:3px 8px;border-radius:16px;font-weight:600;margin-left:6px}
.bp{background:rgba(124,58,237,.2);color:#a78bfa}
.br{background:rgba(16,185,129,.2);color:#6ee7b7}
.bs{background:rgba(59,130,246,.2);color:#93c5fd}
.xbtn{background:#ef4444;border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:active{transform:scale(.9)}
.cam{flex:1;position:relative;background:#000;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover}
.panel{padding:12px 14px;background:#1e293b;flex-shrink:0}
.status{text-align:center;font-size:.85rem;color:#94a3b8;margin-bottom:8px}
.status.ok{color:#10b981;font-weight:600}
.status.err{color:#ef4444;font-weight:600}
.result{background:rgba(16,185,129,.1);border:2px solid #10b981;border-radius:10px;padding:12px;text-align:center;margin-bottom:8px;display:none}
.result.show{display:block}
.result .val{font-size:1.1rem;font-weight:700;color:#10b981;word-break:break-all}
.result .typ{font-size:.7rem;color:#94a3b8;margin-top:4px}
.btns{display:flex;gap:6px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-ok{background:#10b981;color:#fff}
.btn-warn{background:#f59e0b;color:#fff}
.btn-no{background:#ef4444;color:#fff}
.tips{font-size:.72rem;color:#64748b;text-align:center;padding:6px;line-height:1.4}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:.85rem;display:none;z-index:100}
.toast.show{display:block}
.errbox{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#0f172a;z-index:10;padding:24px;text-align:center;flex-direction:column;align-items:center;justify-content:center}
.errbox.show{display:flex}
.errbox .icon{font-size:3rem;margin-bottom:12px}
.errbox .title{font-size:1rem;font-weight:700;color:#ef4444;margin-bottom:8px}
.errbox .desc{font-size:.85rem;color:#94a3b8;margin-bottom:16px;line-height:1.6}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:.9rem;flex-direction:column;gap:12px}
.spinner{width:30px;height:30px;border:3px solid #334155;border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mbadge{position:absolute;top:8px;left:8px;z-index:6;font-size:.65rem;padding:4px 10px;border-radius:16px;font-weight:600;background:rgba(0,0,0,.6);color:#94a3b8;backdrop-filter:blur(4px)}
.scan-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:3}
.scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(75vw,280px);height:min(50vw,180px);border:2px solid rgba(255,255,255,.25);border-radius:12px}
.scan-frame .c{position:absolute;width:min(7vw,24px);height:min(7vw,24px);border:3px solid #10b981}
.scan-frame .c.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.scan-frame .c.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.scan-frame .c.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.scan-frame .c.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 8px 0}
.scan-line{position:absolute;left:10%;width:80%;height:2px;background:linear-gradient(90deg,transparent,#10b981,transparent);animation:scanmove 2s ease-in-out infinite;z-index:4;pointer-events:none}
@keyframes scanmove{0%{top:20%}50%{top:75%}100%{top:20%}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>📷 Scanner <span class="badge" id="badge">-</span></h1>
    <button class="xbtn" onclick="doClose()">✕</button>
  </div>

  <div class="cam" id="camArea">
    <video id="vid" autoplay muted playsinline style="display:none"></video>
    <div class="mbadge" id="modeBadge">Memuat...</div>

    <div class="scan-overlay" id="scanOverlay">
      <div class="scan-frame">
        <div class="c tl"></div><div class="c tr"></div>
        <div class="c bl"></div><div class="c br"></div>
      </div>
      <div class="scan-line"></div>
    </div>

    <div class="errbox" id="errbox">
      <div class="icon">📷</div>
      <div class="title" id="errT">Kamera Error</div>
      <div class="desc" id="errD">Tidak bisa akses kamera</div>
      <button class="btn btn-ok" onclick="startAll()" style="max-width:200px;margin-bottom:8px">🔄 Coba Lagi</button>
      <button class="btn btn-no" onclick="doClose()" style="max-width:200px">✕ Tutup</button>
    </div>

    <div class="loading" id="loadMsg">
      <div class="spinner"></div>
      <div id="loadText">Memuat scanner...</div>
    </div>
  </div>

  <div class="panel">
    <div class="status" id="status">Memulai...</div>
    <div class="tips" id="tips">💡 Dekatkan & pastikan barcode terlihat jelas di dalam kotak.</div>
    <div class="result" id="resBox">
      <div class="typ" id="resTyp">-</div>
      <div class="val" id="resVal">-</div>
    </div>
    <div class="btns" id="btns" style="display:none">
      <button class="btn btn-ok" onclick="doSend()">✅ Kirim</button>
      <button class="btn btn-warn" onclick="doRescan()">🔄 Ulang</button>
      <button class="btn btn-no" onclick="doClose()">✕</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====================================================
// CONFIG
// ====================================================
var params = new URLSearchParams(location.search);
var scanTarget = params.get('target') || 'pesanan';
var scanType = params.get('type') || 'barcode';

var bdg = document.getElementById('badge');
if (scanTarget === 'resi') {
  bdg.textContent = '🚚 Resi';
  bdg.className = 'badge br';
} else if (scanTarget === 'search') {
  bdg.textContent = '🔍 Cari';
  bdg.className = 'badge bs';
} else {
  bdg.textContent = '📋 Pesanan';
  bdg.className = 'badge bp';
}

// ====================================================
// VARIABLES
// ====================================================
var video = document.getElementById('vid');
var camStream = null;
var scanning = false;
var lastResult = '';
var frameId = null;
var audioCtx = null;
var barcodeDetectorReady = false;

// ====================================================
// AUDIO
// ====================================================
function beep() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function tone(freq, delay, dur) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.frequency.value = freq;
      var t = audioCtx.currentTime + delay;
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t);
      o.stop(t + dur);
    }
    tone(1200, 0, 0.15);
    tone(1600, 0.18, 0.2);
  } catch (e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

// ====================================================
// STEP 1: LOAD POLYFILL (agar BarcodeDetector ada di semua browser)
// ====================================================
function loadPolyfill(callback) {
  // Jika sudah ada native BarcodeDetector → langsung pakai
  if ('BarcodeDetector' in window) {
    document.getElementById('modeBadge').textContent = '⚡ Native';
    callback();
    return;
  }

  // Load polyfill dari CDN
  document.getElementById('loadText').textContent = 'Memuat barcode engine...';
  document.getElementById('modeBadge').textContent = '📦 Loading...';

  var script = document.createElement('script');
  script.src = 'https://fastly.jsdelivr.net/npm/barcode-detector@2/dist/es/polyfill.min.js';
  script.onload = function() {
    document.getElementById('modeBadge').textContent = '📦 Polyfill';
    callback();
  };
  script.onerror = function() {
    // Coba CDN alternatif
    var script2 = document.createElement('script');
    script2.src = 'https://unpkg.com/barcode-detector@2/dist/es/polyfill.min.js';
    script2.onload = function() {
      document.getElementById('modeBadge').textContent = '📦 Polyfill';
      callback();
    };
    script2.onerror = function() {
      document.getElementById('modeBadge').textContent = '❌ Gagal';
      showError('📦 Gagal Memuat Engine', 'Library barcode scanner gagal dimuat. Periksa koneksi internet lalu coba lagi.');
    };
    document.head.appendChild(script2);
  };
  document.head.appendChild(script);
}

// ====================================================
// STEP 2: START CAMERA
// ====================================================
function startCamera(callback) {
  document.getElementById('loadText').textContent = 'Meminta izin kamera...';

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('🚫 Browser Tidak Support', 'Browser ini tidak mendukung akses kamera. Gunakan Chrome terbaru.');
    return;
  }

  // Minta resolusi tinggi untuk barcode kecil
  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { min: 640, ideal: 1920 },
      height: { min: 480, ideal: 1080 }
    },
    audio: false
  })
  .then(function(s) {
    camStream = s;
    onCamReady(callback);
  })
  .catch(function(err) {
    // Fallback: kamera depan / setting minimal
    navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    })
    .then(function(s) {
      camStream = s;
      onCamReady(callback);
    })
    .catch(function(err2) {
      handleCamError(err);
    });
  });
}

function onCamReady(callback) {
  video.srcObject = camStream;
  video.style.display = 'block';
  document.getElementById('loadMsg').style.display = 'none';
  document.getElementById('scanOverlay').style.display = 'block';

  // Apply continuous autofocus jika tersedia
  try {
    var track = camStream.getVideoTracks()[0];
    if (track) {
      var cap = track.getCapabilities();
      if (cap && cap.focusMode) {
        var modes = cap.focusMode;
        if (modes.indexOf('continuous') >= 0) {
          track.applyConstraints({
            advanced: [{ focusMode: 'continuous' }]
          });
        }
      }
    }
  } catch (e) {}

  video.onloadedmetadata = function() {
    video.play();
    callback();
  };
}

function handleCamError(err) {
  var msg = err.toString();
  if (msg.indexOf('NotAllowed') >= 0 || msg.indexOf('Permission') >= 0) {
    showError('🚫 Izin Kamera Ditolak', 'Klik ikon 🔒 di address bar → Camera → Allow → lalu klik Coba Lagi.');
  } else if (msg.indexOf('NotFound') >= 0) {
    showError('📷 Kamera Tidak Ditemukan', 'Perangkat ini tidak memiliki kamera atau webcam.');
  } else if (msg.indexOf('NotReadable') >= 0) {
    showError('⚠️ Kamera Sedang Dipakai', 'Tutup aplikasi atau tab lain yang menggunakan kamera, lalu Coba Lagi.');
  } else {
    showError('❌ Kamera Error', msg);
  }
}

function showError(title, desc) {
  document.getElementById('loadMsg').style.display = 'none';
  document.getElementById('errT').textContent = title;
  document.getElementById('errD').textContent = desc;
  document.getElementById('errbox').classList.add('show');
  document.getElementById('scanOverlay').style.display = 'none';
  setStatus('❌ Error', 'err');
}

// ====================================================
// STEP 3: START BARCODE SCANNING
// ====================================================
function startScanning() {
  scanning = true;
  lastResult = '';
  setStatus('📷 Arahkan ke barcode / QR code...', '');
  document.getElementById('scanOverlay').style.display = 'block';
  document.getElementById('tips').style.display = 'block';

  var formats;
  if (scanType === 'qrcode') {
    formats = ['qr_code'];
  } else {
    formats = [
      'qr_code', 'code_128', 'code_39', 'code_93',
      'ean_13', 'ean_8', 'upc_a', 'upc_e',
      'itf', 'codabar'
    ];
  }

  var detector;
  try {
    detector = new BarcodeDetector({ formats: formats });
  } catch (e) {
    try {
      detector = new BarcodeDetector();
    } catch (e2) {
      setStatus('❌ BarcodeDetector tidak tersedia', 'err');
      return;
    }
  }

  function scanLoop() {
    if (!scanning) return;

    // Pastikan video siap
    if (video.readyState < 2) {
      frameId = requestAnimationFrame(scanLoop);
      return;
    }

    detector.detect(video)
      .then(function(codes) {
        if (!scanning) return;

        if (codes.length > 0) {
          var code = codes[0];
          if (code.rawValue && code.rawValue !== lastResult) {
            lastResult = code.rawValue;
            onFound(code.rawValue, code.format);
            return;
          }
        }

        frameId = requestAnimationFrame(scanLoop);
      })
      .catch(function(err) {
        if (!scanning) return;
        frameId = requestAnimationFrame(scanLoop);
      });
  }

  scanLoop();
}

// ====================================================
// ON BARCODE FOUND
// ====================================================
function onFound(value, format) {
  scanning = false;
  if (frameId) {
    cancelAnimationFrame(frameId);
    frameId = null;
  }

  beep();
  try { if (navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch (e) {}

  var typeLabel;
  if (format === 'qr_code') {
    typeLabel = 'QR Code';
  } else {
    typeLabel = 'Barcode (' + format + ')';
  }

  document.getElementById('resVal').textContent = value;
  document.getElementById('resTyp').textContent = typeLabel;
  document.getElementById('resBox').classList.add('show');
  document.getElementById('btns').style.display = 'flex';
  document.getElementById('tips').style.display = 'none';
  document.getElementById('scanOverlay').style.display = 'none';
  setStatus('✅ Berhasil scan!', 'ok');
}

// ====================================================
// ACTIONS
// ====================================================
function doSend() {
  var value = document.getElementById('resVal').textContent;
  var type = document.getElementById('resTyp').textContent;

  if (window.opener) {
    try {
      window.opener.postMessage({
        source: 'packing-scanner',
        action: 'scan-result',
        target: scanTarget,
        value: value,
        type: type
      }, '*');
      showToast('✅ Kode dikirim!');
      stopAll();
      setTimeout(function() { window.close(); }, 800);
      return;
    } catch (e) {}
  }

  // Fallback: copy
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(function() {
      showToast('📋 Disalin! Paste di form.');
      setTimeout(function() { try { window.close(); } catch(e) {} }, 1500);
    }).catch(function() {
      prompt('Salin kode ini:', value);
    });
  } else {
    prompt('Salin kode ini:', value);
  }
}

function doRescan() {
  lastResult = '';
  document.getElementById('resBox').classList.remove('show');
  document.getElementById('btns').style.display = 'none';
  startScanning();
}

function stopAll() {
  scanning = false;
  if (frameId) {
    cancelAnimationFrame(frameId);
    frameId = null;
  }
  if (camStream) {
    try {
      camStream.getTracks().forEach(function(t) { t.stop(); });
    } catch (e) {}
    camStream = null;
  }
  video.srcObject = null;
}

function doClose() {
  stopAll();
  try { window.close(); } catch (e) {}
  setTimeout(function() { window.history.back(); }, 300);
}

// ====================================================
// MAIN: Start Everything
// ====================================================
function startAll() {
  document.getElementById('errbox').classList.remove('show');
  document.getElementById('loadMsg').style.display = 'flex';
  document.getElementById('resBox').classList.remove('show');
  document.getElementById('btns').style.display = 'none';

  // Step 1: Load polyfill
  loadPolyfill(function() {
    // Step 2: Start camera
    startCamera(function() {
      // Step 3: Start scanning
      startScanning();
    });
  });
}

// ====================================================
// INIT
// ====================================================
window.addEventListener('load', function() {
  startAll();
});

window.addEventListener('beforeunload', function() {
  stopAll();
});
</script>
</body>
</html>
