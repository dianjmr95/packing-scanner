<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;flex-shrink:0}
.bar h1{font-size:.9rem}
.badge{font-size:.65rem;padding:3px 8px;border-radius:16px;font-weight:600;margin-left:6px}
.bp{background:rgba(124,58,237,.2);color:#a78bfa}
.br{background:rgba(16,185,129,.2);color:#6ee7b7}
.bs{background:rgba(59,130,246,.2);color:#93c5fd}
.xbtn{background:#ef4444;border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:active{transform:scale(.9)}
.cam{flex:1;position:relative;background:#000;overflow:hidden}
#reader{width:100%!important;height:100%!important;border:none!important}
#reader video{width:100%!important;height:100%!important;object-fit:cover!important}
#reader img[alt="Info icon"],#reader__header_message,#reader__status_span{display:none!important}
#reader__dashboard{position:absolute!important;bottom:0!important;left:0!important;right:0!important;background:rgba(0,0,0,.7)!important;padding:6px!important;z-index:5;max-height:50px;overflow:hidden}
#reader__dashboard button{background:#10b981!important;color:#fff!important;border:none!important;padding:5px 10px!important;border-radius:6px!important;font-weight:600!important;font-size:.72rem!important}
#reader__dashboard select{background:#333!important;color:#fff!important;border:1px solid #555!important;padding:3px 6px!important;border-radius:4px!important;font-size:.72rem!important}
#reader__dashboard span,#reader__dashboard a{color:#ccc!important;font-size:.68rem!important}
#reader__scan_region{min-height:80px!important;overflow:hidden!important}
#reader__scan_region img{display:none!important}
.panel{padding:12px 14px;background:#1e293b;flex-shrink:0}
.status{text-align:center;font-size:.85rem;color:#94a3b8;margin-bottom:8px}
.status.ok{color:#10b981;font-weight:600}
.status.err{color:#ef4444;font-weight:600}
.result{background:rgba(16,185,129,.1);border:2px solid #10b981;border-radius:10px;padding:12px;text-align:center;margin-bottom:8px;display:none}
.result.show{display:block}
.result .val{font-size:1.1rem;font-weight:700;color:#10b981;word-break:break-all}
.result .typ{font-size:.7rem;color:#94a3b8;margin-top:4px}
.btns{display:flex;gap:6px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-ok{background:#10b981;color:#fff}
.btn-warn{background:#f59e0b;color:#fff}
.btn-no{background:#ef4444;color:#fff}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:.85rem;display:none;z-index:100}
.toast.show{display:block}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:.9rem;flex-direction:column;gap:12px}
.spinner{width:30px;height:30px;border:3px solid #334155;border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#0f172a;z-index:10;padding:24px;text-align:center;flex-direction:column;align-items:center;justify-content:center}
.errbox.show{display:flex}
.errbox .icon{font-size:3rem;margin-bottom:12px}
.errbox .title{font-size:1rem;font-weight:700;color:#ef4444;margin-bottom:8px}
.errbox .desc{font-size:.85rem;color:#94a3b8;margin-bottom:16px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>📷 Scanner <span class="badge" id="badge">-</span></h1>
    <button class="xbtn" onclick="doClose()">✕</button>
  </div>
  <div class="cam">
    <div id="reader"></div>
    <div class="errbox" id="errbox">
      <div class="icon">📷</div>
      <div class="title" id="errT">Error</div>
      <div class="desc" id="errD">-</div>
      <button class="btn btn-ok" onclick="startScan()" style="max-width:220px;margin-bottom:8px">🔄 Coba Lagi</button>
      <button class="btn btn-no" onclick="doClose()" style="max-width:220px">✕ Tutup</button>
    </div>
    <div class="loading" id="loadMsg"><div class="spinner"></div><div>Memulai scanner...</div></div>
  </div>
  <div class="panel">
    <div class="status" id="status">Memulai...</div>
    <div class="result" id="resBox"><div class="typ" id="resTyp">-</div><div class="val" id="resVal">-</div></div>
    <div class="btns" id="btns" style="display:none">
      <button class="btn btn-ok" onclick="doSend()">✅ Kirim</button>
      <button class="btn btn-warn" onclick="doRescan()">🔄 Ulang</button>
      <button class="btn btn-no" onclick="doClose()">✕</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var P=new URLSearchParams(location.search),scanTarget=P.get('target')||'pesanan',scanType=P.get('type')||'barcode';
var bdg=document.getElementById('badge');
if(scanTarget==='resi'){bdg.textContent='🚚 Resi';bdg.className='badge br'}
else if(scanTarget==='search'){bdg.textContent='🔍 Cari';bdg.className='badge bs'}
else{bdg.textContent='📋 Pesanan';bdg.className='badge bp'}
var scanner=null,lastVal='',paused=false,audioCtx=null;
function beep(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();function t(f,dl,d){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;var tm=audioCtx.currentTime+dl;g.gain.setValueAtTime(.3,tm);g.gain.exponentialRampToValueAtTime(.001,tm+d);o.start(tm);o.stop(tm+d)}t(1200,0,.15);t(1600,.18,.2)}catch(e){}}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},3000)}
function setStatus(m,c){var el=document.getElementById('status');el.textContent=m;el.className='status'+(c?' '+c:'')}
function getFmts(){if(typeof Html5QrcodeSupportedFormats==='undefined')return undefined;if(scanType==='qrcode')return[Html5QrcodeSupportedFormats.QR_CODE];return[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODE_93,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR]}
function startScan(){document.getElementById('errbox').classList.remove('show');document.getElementById('loadMsg').style.display='flex';document.getElementById('resBox').classList.remove('show');document.getElementById('btns').style.display='none';paused=false;lastVal='';if(typeof Html5Qrcode==='undefined'){document.getElementById('loadMsg').style.display='none';document.getElementById('errT').textContent='📦 Library Error';document.getElementById('errD').textContent='Scanner gagal dimuat.';document.getElementById('errbox').classList.add('show');return}if(scanner){try{scanner.stop().then(function(){try{scanner.clear()}catch(e){}doInit()}).catch(function(){try{scanner.clear()}catch(e){}doInit()})}catch(e){doInit()}}else{doInit()}}
function doInit(){document.getElementById('reader').innerHTML='';scanner=new Html5Qrcode('reader');var config={fps:15,qrbox:function(vw,vh){var m=Math.min(vw,vh),s=Math.floor(m*.75);s=Math.max(120,Math.min(s,350));if(scanType==='barcode')return{width:s,height:Math.max(80,Math.floor(s*.4))};return{width:s,height:Math.max(100,Math.floor(s*.85))}},formatsToSupport:getFmts(),experimentalFeatures:{useBarCodeDetectorIfSupported:true}};scanner.start({facingMode:'environment'},config,onScanOK,function(){}).then(function(){document.getElementById('loadMsg').style.display='none';setStatus('📷 Arahkan ke barcode / QR code...','')}).catch(function(err){scanner.start({facingMode:'user'},config,onScanOK,function(){}).then(function(){document.getElementById('loadMsg').style.display='none';setStatus('📷 Arahkan ke barcode/QR...','')}).catch(function(){document.getElementById('loadMsg').style.display='none';var msg=err.toString();document.getElementById('errT').textContent=msg.indexOf('NotAllowed')>=0?'🚫 Izin Ditolak':'❌ Error';document.getElementById('errD').textContent=msg.indexOf('NotAllowed')>=0?'🔒 → Camera → Allow':msg;document.getElementById('errbox').classList.add('show');setStatus('❌ Error','err')})})}
function onScanOK(text,result){if(paused)return;if(text===lastVal)return;lastVal=text;paused=true;beep();try{if(navigator.vibrate)navigator.vibrate([100,50,100])}catch(e){}try{scanner.pause(true)}catch(e){}var fmt='Barcode';try{fmt=result.result.format.formatName}catch(e){}var typeLabel=(fmt==='QR_CODE')?'QR Code':'Barcode ('+fmt+')';document.getElementById('resVal').textContent=text;document.getElementById('resTyp').textContent=typeLabel;document.getElementById('resBox').classList.add('show');document.getElementById('btns').style.display='flex';setStatus('✅ Berhasil!','ok')}
function doSend(){var value=document.getElementById('resVal').textContent,type=document.getElementById('resTyp').textContent;if(window.opener){try{window.opener.postMessage({source:'packing-scanner',action:'scan-result',target:scanTarget,value:value,type:type},'*');showToast('✅ Kode dikirim!');stopAll();setTimeout(function(){window.close()},800);return}catch(e){}}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(function(){showToast('📋 Disalin!');setTimeout(function(){try{window.close()}catch(e){}},1500)}).catch(function(){prompt('Salin:',value)})}else{prompt('Salin:',value)}}
function doRescan(){lastVal='';paused=false;document.getElementById('resBox').classList.remove('show');document.getElementById('btns').style.display='none';setStatus('📷 Arahkan ke barcode/QR...','');try{scanner.resume()}catch(e){startScan()}}
function stopAll(){paused=true;if(scanner){try{scanner.stop().then(function(){try{scanner.clear()}catch(e){}}).catch(function(){})}catch(e){}}}
function doClose(){stopAll();try{window.close()}catch(e){}setTimeout(function(){window.history.back()},300)}
window.addEventListener('load',function(){setTimeout(function(){startScan()},500)});
window.addEventListener('beforeunload',function(){stopAll()});
</script>
</body>
</html>
