<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%}

.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;flex-shrink:0}
.bar h1{font-size:.9rem}
.bar .badge{font-size:.65rem;padding:3px 8px;border-radius:16px;font-weight:600;margin-left:6px}
.bar .bp{background:rgba(124,58,237,.2);color:#a78bfa}
.bar .br{background:rgba(16,185,129,.2);color:#6ee7b7}
.bar .bs{background:rgba(59,130,246,.2);color:#93c5fd}
.xbtn{background:#ef4444;border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:active{transform:scale(.9)}

.cam{flex:1;position:relative;background:#000;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover}

.panel{padding:12px 14px;background:#1e293b;flex-shrink:0}
.status{text-align:center;font-size:.85rem;color:#94a3b8;margin-bottom:8px}
.status.ok{color:#10b981;font-weight:600}
.status.err{color:#ef4444;font-weight:600}

.result{background:rgba(16,185,129,.1);border:2px solid #10b981;border-radius:10px;padding:12px;text-align:center;margin-bottom:8px;display:none}
.result.show{display:block}
.result .val{font-size:1.1rem;font-weight:700;color:#10b981;word-break:break-all}
.result .typ{font-size:.7rem;color:#94a3b8;margin-top:4px}

.btns{display:flex;gap:6px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-ok{background:#10b981;color:#fff}
.btn-warn{background:#f59e0b;color:#fff}
.btn-no{background:#ef4444;color:#fff}
.btn-out{background:transparent;border:2px solid rgba(255,255,255,.2);color:#fff}

.errbox{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#0f172a;z-index:10;padding:24px;text-align:center;flex-direction:column;align-items:center;justify-content:center}
.errbox.show{display:flex}
.errbox .icon{font-size:3rem;margin-bottom:12px}
.errbox .title{font-size:1rem;font-weight:700;color:#ef4444;margin-bottom:8px}
.errbox .desc{font-size:.85rem;color:#94a3b8;margin-bottom:16px;line-height:1.6}

.tips{font-size:.72rem;color:#64748b;text-align:center;padding:6px;line-height:1.4}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:.85rem;display:none;z-index:100}
.toast.show{display:block}

.loading{display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:.9rem;flex-direction:column;gap:12px}
.spinner{width:30px;height:30px;border:3px solid #334155;border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>📷 Scanner <span class="badge" id="badge">-</span></h1>
    <button class="xbtn" onclick="doClose()">✕</button>
  </div>

  <div class="cam" id="camArea">
    <video id="vid" autoplay muted playsinline></video>
    <div class="errbox" id="errbox">
      <div class="icon">📷</div>
      <div class="title" id="errT">Kamera Error</div>
      <div class="desc" id="errD">Tidak bisa mengakses kamera</div>
      <button class="btn btn-ok" onclick="startCam()" style="max-width:200px;margin-bottom:8px">🔄 Coba Lagi</button>
      <button class="btn btn-no" onclick="doClose()" style="max-width:200px">✕ Tutup</button>
    </div>
    <div class="loading" id="loadMsg">
      <div class="spinner"></div>
      <div>Meminta izin kamera...</div>
    </div>
  </div>

  <div class="panel">
    <div class="status" id="status">Memulai...</div>
    <div class="tips" id="tips">💡 Dekatkan kamera ke barcode. Pastikan barcode terlihat jelas.</div>
    <div class="result" id="resBox">
      <div class="typ" id="resTyp">-</div>
      <div class="val" id="resVal">-</div>
    </div>
    <div class="btns" id="btns" style="display:none">
      <button class="btn btn-ok" onclick="doSend()">✅ Kirim</button>
      <button class="btn btn-warn" onclick="doRescan()">🔄 Ulang</button>
      <button class="btn btn-no" onclick="doClose()">✕</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====================================================
// CONFIG
// ====================================================
var params = new URLSearchParams(location.search);
var scanTarget = params.get('target') || 'pesanan';
var scanType = params.get('type') || 'barcode';

// Badge
var bdg = document.getElementById('badge');
if (scanTarget === 'resi') { bdg.textContent = '🚚 Resi'; bdg.className = 'badge br'; }
else if (scanTarget === 'search') { bdg.textContent = '🔍 Cari'; bdg.className = 'badge bs'; }
else { bdg.textContent = '📋 Pesanan'; bdg.className = 'badge bp'; }

// ====================================================
// VARIABLES
// ====================================================
var video = document.getElementById('vid');
var stream = null;
var detector = null;
var scanning = false;
var lastResult = '';
var animId = null;
var audioCtx = null;

// ====================================================
// AUDIO
// ====================================================
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g);
    g.connect(audioCtx.destination);
    o.frequency.value = 1200;
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.start();
    o.stop(audioCtx.currentTime + 0.15);
    setTimeout(function() {
      var o2 = audioCtx.createOscillator();
      var g2 = audioCtx.createGain();
      o2.connect(g2);
      g2.connect(audioCtx.destination);
      o2.frequency.value = 1600;
      g2.gain.setValueAtTime(0.3, audioCtx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      o2.start();
      o2.stop(audioCtx.currentTime + 0.2);
    }, 180);
  } catch (e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

// ====================================================
// START CAMERA - HIGH RESOLUTION
// ====================================================
function startCam() {
  document.getElementById('loadMsg').style.display = 'flex';
  document.getElementById('errbox').classList.remove('show');
  video.style.display = 'none';
  setStatus('⏳ Meminta izin kamera...', '');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('Browser Tidak Support', 'Gunakan Chrome terbaru.');
    return;
  }

  // Minta resolusi TINGGI + auto focus
  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { min: 640, ideal: 1920 },
      height: { min: 480, ideal: 1080 },
    },
    audio: false
  })
  .then(function(s) {
    stream = s;
    video.srcObject = s;
    video.style.display = 'block';
    document.getElementById('loadMsg').style.display = 'none';

    video.onloadedmetadata = function() {
      video.play();
      setStatus('📷 Arahkan ke barcode / QR code...', '');

      // Apply auto focus
      try {
        var track = s.getVideoTracks()[0];
        var cap = track.getCapabilities();
        if (cap.focusMode && cap.focusMode.indexOf('continuous') >= 0) {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch (e) {}

      // Start detection
      startDetect();
    };
  })
  .catch(function(err) {
    // Try front camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
    .then(function(s) {
      stream = s;
      video.srcObject = s;
      video.style.display = 'block';
      document.getElementById('loadMsg').style.display = 'none';
      video.onloadedmetadata = function() {
        video.play();
        setStatus('📷 Arahkan ke barcode/QR...', '');
        startDetect();
      };
    })
    .catch(function(err2) {
      var msg = err.toString();
      if (msg.indexOf('NotAllowed') >= 0) {
        showError('🚫 Izin Ditolak', 'Klik 🔒 di address bar → Camera → Allow → Coba Lagi');
      } else if (msg.indexOf('NotFound') >= 0) {
        showError('📷 Tidak Ada Kamera', 'Perangkat ini tidak punya kamera.');
      } else {
        showError('❌ Error', msg);
      }
    });
  });
}

function showError(title, desc) {
  document.getElementById('loadMsg').style.display = 'none';
  document.getElementById('errT').textContent = title;
  document.getElementById('errD').textContent = desc;
  document.getElementById('errbox').classList.add('show');
  setStatus('❌ Kamera tidak tersedia', 'err');
}

// ====================================================
// BARCODE DETECTION - NATIVE API + FALLBACK
// ====================================================
function startDetect() {
  scanning = true;
  lastResult = '';

  // Method 1: Native BarcodeDetector (Chrome Android)
  if ('BarcodeDetector' in window) {
    var formats;
    if (scanType === 'qrcode') {
      formats = ['qr_code'];
    } else {
      formats = ['qr_code', 'code_128', 'code_39', 'code_93', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar'];
    }

    try {
      detector = new BarcodeDetector({ formats: formats });
    } catch (e) {
      detector = new BarcodeDetector();
    }

    function loop() {
      if (!scanning) return;
      if (video.readyState < 2) {
        animId = requestAnimationFrame(loop);
        return;
      }

      detector.detect(video)
        .then(function(codes) {
          if (codes.length > 0) {
            var val = codes[0].rawValue;
            if (val && val !== lastResult) {
              lastResult = val;
              onFound(val, codes[0].format);
              return;
            }
          }
          animId = requestAnimationFrame(loop);
        })
        .catch(function() {
          animId = requestAnimationFrame(loop);
        });
    }
    loop();
    return;
  }

  // Method 2: Fallback - manual message
  setStatus('⚠️ Browser tidak support auto-scan. Gunakan Chrome Android.', 'err');
}

// ====================================================
// ON BARCODE FOUND
// ====================================================
function onFound(value, format) {
  scanning = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }

  beep();
  try { if (navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch (e) {}

  var typeLabel = (format === 'qr_code') ? 'QR Code' : 'Barcode (' + format + ')';

  document.getElementById('resVal').textContent = value;
  document.getElementById('resTyp').textContent = typeLabel;
  document.getElementById('resBox').classList.add('show');
  document.getElementById('btns').style.display = 'flex';
  document.getElementById('tips').style.display = 'none';
  setStatus('✅ Berhasil scan!', 'ok');
}

// ====================================================
// ACTIONS
// ====================================================
function doSend() {
  var value = document.getElementById('resVal').textContent;
  var type = document.getElementById('resTyp').textContent;

  // Send to opener (Google Apps Script)
  if (window.opener) {
    try {
      window.opener.postMessage({
        source: 'packing-scanner',
        action: 'scan-result',
        target: scanTarget,
        value: value,
        type: type
      }, '*');
      showToast('✅ Kode dikirim!');
      stopCam();
      setTimeout(function() { window.close(); }, 800);
      return;
    } catch (e) {}
  }

  // Fallback: copy to clipboard
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(function() {
      showToast('📋 Disalin! Paste di form.');
      setTimeout(function() { try { window.close(); } catch(e) {} }, 1500);
    }).catch(function() {
      prompt('Salin kode ini:', value);
    });
  } else {
    prompt('Salin kode ini:', value);
  }
}

function doRescan() {
  lastResult = '';
  document.getElementById('resBox').classList.remove('show');
  document.getElementById('btns').style.display = 'none';
  document.getElementById('tips').style.display = 'block';
  setStatus('📷 Arahkan ke barcode/QR...', '');
  startDetect();
}

function stopCam() {
  scanning = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  if (stream) {
    try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch (e) {}
    stream = null;
  }
  video.srcObject = null;
}

function doClose() {
  stopCam();
  try { window.close(); } catch (e) {}
  setTimeout(function() { window.history.back(); }, 300);
}

// ====================================================
// INIT
// ====================================================
window.addEventListener('load', function() {
  startCam();
});

window.addEventListener('beforeunload', function() {
  stopCam();
});
</script>
</body>
</html>
