<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --ok: #10b981;
    --err: #ef4444;
    --bg: #0f172a;
    --card: #1e293b;
    --txt: #f1f5f9;
    --dim: #94a3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--txt);
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  /* LAYOUT: flex column full height */
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }

  /* TOP BAR */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--card);
    border-bottom: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
    min-height: 48px;
  }
  .top h1 {
    font-size: .85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .badge {
    font-size: .62rem;
    padding: 3px 8px;
    border-radius: 16px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-pesanan { background: rgba(124,58,237,.2); color: #a78bfa; }
  .badge-resi { background: rgba(16,185,129,.2); color: #6ee7b7; }
  .badge-search { background: rgba(59,130,246,.2); color: #93c5fd; }

  .xbtn {
    background: var(--err);
    border: none;
    color: #fff;
    min-width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .xbtn:active { transform: scale(.9); }

  /* SCANNER VIEW */
  .scanview {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
    min-height: 0; /* penting untuk flex shrink */
  }

  /* html5-qrcode overrides */
  #reader {
    width: 100% !important;
    height: 100% !important;
    border: none !important;
  }
  #reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
  /* Sembunyikan elemen UI bawaan library yang mengganggu */
  #reader img[alt="Info icon"],
  #reader__header_message,
  #reader__status_span {
    display: none !important;
  }
  /* Style dashboard bawaan library */
  #reader__dashboard {
    position: absolute !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    background: rgba(0,0,0,.75) !important;
    padding: 6px 8px !important;
    z-index: 5;
    max-height: 60px;
    overflow: hidden;
  }
  #reader__dashboard button {
    background: var(--ok) !important;
    color: #fff !important;
    border: none !important;
    padding: 6px 12px !important;
    border-radius: 6px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    font-size: .75rem !important;
  }
  #reader__dashboard select {
    background: #333 !important;
    color: #fff !important;
    border: 1px solid #555 !important;
    padding: 4px 6px !important;
    border-radius: 4px !important;
    font-size: .75rem !important;
  }
  #reader__dashboard span,
  #reader__dashboard a {
    color: #ccc !important;
    font-size: .7rem !important;
  }
  #reader__scan_region {
    min-height: 100px !important;
    overflow: hidden !important;
  }
  #reader__scan_region img {
    display: none !important;
  }

  /* Custom scan overlay */
  .scanover {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 4;
  }
  .scanframe {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(70vw, 250px);
    height: min(50vw, 170px);
    border: 2px solid rgba(255,255,255,.3);
    border-radius: 12px;
  }
  .scanframe .c {
    position: absolute;
    width: min(7vw, 24px);
    height: min(7vw, 24px);
    border: 3px solid var(--ok);
  }
  .scanframe .c.tl { top:-1px; left:-1px; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }
  .scanframe .c.tr { top:-1px; right:-1px; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }
  .scanframe .c.bl { bottom:-1px; left:-1px; border-right:none; border-top:none; border-radius:0 0 0 8px; }
  .scanframe .c.br { bottom:-1px; right:-1px; border-left:none; border-top:none; border-radius:0 0 8px 0; }

  .sweep {
    position: absolute;
    left: 10%; width: 80%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--ok), transparent);
    animation: sw 2s ease-in-out infinite;
    z-index: 5;
    pointer-events: none;
  }
  @keyframes sw { 0%{top:20%} 50%{top:75%} 100%{top:20%} }

  .flash {
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background: rgba(16,185,129,.25);
    display: none;
    z-index: 8;
  }
  .flash.show { display:block; animation: fl .3s; }
  @keyframes fl { from{opacity:1} to{opacity:0} }

  /* BOTTOM PANEL */
  .bot {
    padding: 10px 12px;
    background: var(--card);
    border-top: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
  }
  .msg {
    text-align: center;
    font-size: .8rem;
    color: var(--dim);
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .msg.ok { color: var(--ok); font-weight: 600; }
  .msg.er { color: var(--err); font-weight: 600; }

  .resbox {
    background: rgba(16,185,129,.1);
    border: 2px solid var(--ok);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    margin-bottom: 8px;
    display: none;
  }
  .resbox.show { display: block; }
  .resbox .val {
    font-size: min(4.5vw, 1.1rem);
    font-weight: 700;
    color: var(--ok);
    word-break: break-all;
    margin-bottom: 2px;
  }
  .resbox .typ { font-size: .68rem; color: var(--dim); }

  .btns { display: flex; gap: 6px; }
  .btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-family: inherit;
  }
  .btn:active { transform: scale(.96); }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-warn { background: #f59e0b; color: #fff; }
  .btn-no { background: var(--err); color: #fff; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%);
    background: var(--ok);
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: .82rem;
    display: none;
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { display:block; animation: tin .3s; }
  @keyframes tin { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* ERROR PANEL */
  .errpanel {
    display: none;
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background: var(--bg);
    z-index: 20;
    padding: 20px;
    text-align: center;
    overflow-y: auto;
  }
  .errpanel.show { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .errpanel .ei { font-size: 2.5rem; margin-bottom: 12px; }
  .errpanel .et { font-size: .95rem; font-weight: 700; color: var(--err); margin-bottom: 6px; }
  .errpanel .ed { font-size: .8rem; color: var(--dim); margin-bottom: 12px; line-height: 1.6; }
  .errpanel .es { text-align: left; font-size: .78rem; color: var(--dim); line-height: 2; margin-bottom: 16px; padding-left: 20px; }

  /* RESPONSIVE */
  @media (max-height: 400px) {
    .top { padding: 4px 8px; min-height: 36px; }
    .top h1 { font-size: .75rem; }
    .xbtn { min-width: 30px; height: 30px; font-size: .9rem; }
    .bot { padding: 6px 8px; }
    .msg { font-size: .72rem; margin-bottom: 4px; }
    .resbox { padding: 6px; margin-bottom: 4px; }
    .resbox .val { font-size: .85rem; }
    .btn { padding: 8px; font-size: .75rem; }
    .scanframe { width: min(60vw, 200px); height: min(35vw, 120px); }
    #reader__dashboard { max-height: 40px; padding: 4px !important; }
  }
  @media (max-width: 300px) {
    .top h1 { font-size: .7rem; }
    .badge { font-size: .55rem; padding: 2px 6px; }
    .xbtn { min-width: 28px; height: 28px; font-size: .85rem; }
    .msg { font-size: .7rem; }
    .btn { font-size: .72rem; padding: 8px 4px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <h1>📷 Scanner <span class="badge" id="badge">-</span></h1>
    <button class="xbtn" onclick="closePage()">✕</button>
  </div>

  <div class="scanview" id="scanview">
    <div id="reader"></div>
    <div class="scanover" id="overlay">
      <div class="scanframe">
        <div class="c tl"></div><div class="c tr"></div>
        <div class="c bl"></div><div class="c br"></div>
      </div>
      <div class="sweep" id="sweep"></div>
    </div>
    <div class="flash" id="flash"></div>

    <div class="errpanel" id="errp">
      <div class="ei">📷</div>
      <div class="et" id="erT">Izin Kamera</div>
      <div class="ed" id="erD">-</div>
      <div class="es" id="erS"></div>
      <button class="btn btn-ok" onclick="doRetry()" style="max-width:220px;width:100%;margin-bottom:8px">🔄 Coba Lagi</button>
      <button class="btn btn-no" onclick="closePage()" style="max-width:220px;width:100%">✕ Kembali</button>
    </div>
  </div>

  <div class="bot">
    <div class="msg" id="msg">Memulai...</div>
    <div class="resbox" id="resbox">
      <div class="typ" id="rTyp">-</div>
      <div class="val" id="rVal">-</div>
    </div>
    <div class="btns" id="btns" style="display:none">
      <button class="btn btn-ok" onclick="sendResult()">✅ Kirim</button>
      <button class="btn btn-warn" onclick="doRescan()">🔄 Ulang</button>
      <button class="btn btn-no" onclick="closePage()">✕</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var P = new URLSearchParams(location.search);
var scanTarget = P.get('target') || 'pesanan';
var scanType = P.get('type') || 'barcode';
var scanner = null;
var lastVal = '';
var paused = false;
var audioCtx = null;

// Badge
var bg = document.getElementById('badge');
if (scanTarget === 'resi') { bg.textContent = '🚚 Resi'; bg.className = 'badge badge-resi'; }
else if (scanTarget === 'search') { bg.textContent = '🔍 Cari'; bg.className = 'badge badge-search'; }
else { bg.textContent = '📋 Pesanan'; bg.className = 'badge badge-pesanan'; }

// Audio
function beep(f, d) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = f || 1200;
    g.gain.setValueAtTime(0.4, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (d || 200) / 1000);
    o.start(); o.stop(audioCtx.currentTime + (d || 200) / 1000);
  } catch (e) {}
}
function beepOK() { beep(1200, 150); setTimeout(function() { beep(1600, 200); }, 180); }
function vib() { try { if (navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch (e) {} }

// Toast
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// Formats
function getFmts() {
  if (typeof Html5QrcodeSupportedFormats === 'undefined') return undefined;
  if (scanType === 'qrcode') return [Html5QrcodeSupportedFormats.QR_CODE];
  return [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.CODABAR
  ];
}

// QR box size - responsive berdasarkan ukuran viewport
function getQrBox(vw, vh) {
  var minD = Math.min(vw, vh);
  var size = Math.floor(minD * 0.65);
  // Minimum 100px, maksimum 280px
  size = Math.max(100, Math.min(size, 280));
  
  if (scanType === 'barcode') {
    return { width: size, height: Math.max(60, Math.floor(size * 0.4)) };
  } else {
    return { width: size, height: Math.max(80, Math.floor(size * 0.85)) };
  }
}

// Start scanner
function startScan() {
  document.getElementById('msg').textContent = '⏳ Meminta izin kamera...';
  document.getElementById('msg').className = 'msg';
  document.getElementById('errp').classList.remove('show');
  document.getElementById('overlay').style.display = 'block';
  paused = false;

  // Cleanup previous
  if (scanner) {
    try {
      scanner.stop().then(function() {
        try { scanner.clear(); } catch(e) {}
        doInit();
      }).catch(function() {
        try { scanner.clear(); } catch(e) {}
        doInit();
      });
    } catch (e) {
      doInit();
    }
  } else {
    doInit();
  }
}

function doInit() {
  // Clear reader div
  var readerEl = document.getElementById('reader');
  readerEl.innerHTML = '';

  scanner = new Html5Qrcode('reader');

  var config = {
    fps: 12,
    qrbox: getQrBox,
    formatsToSupport: getFmts(),
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    },
    // Penting: biarkan library menentukan aspect ratio
    aspectRatio: undefined
  };

  // Coba kamera belakang dulu
  scanner.start(
    { facingMode: 'environment' },
    config,
    onScanOK,
    function() {} // ignore per-frame failures
  ).then(function() {
    document.getElementById('msg').textContent = '📷 Arahkan ke barcode / QR code...';
    document.getElementById('errp').classList.remove('show');
  }).catch(function(err) {
    // Fallback kamera depan
    scanner.start(
      { facingMode: 'user' },
      config,
      onScanOK,
      function() {}
    ).then(function() {
      document.getElementById('msg').textContent = '📷 Arahkan ke barcode/QR...';
      document.getElementById('errp').classList.remove('show');
    }).catch(function(err2) {
      showScanError(err2);
    });
  });
}

function onScanOK(text, result) {
  if (paused) return;
  if (text === lastVal) return;
  lastVal = text;
  paused = true;

  beepOK();
  vib();

  // Flash
  var fl = document.getElementById('flash');
  fl.classList.remove('show');
  void fl.offsetWidth;
  fl.classList.add('show');
  setTimeout(function() { fl.classList.remove('show'); }, 300);

  // Pause
  try { scanner.pause(true); } catch (e) {}

  // Format
  var fmt = 'Barcode';
  try { fmt = result.result.format.formatName; } catch (e) {}
  var typeLabel = (fmt === 'QR_CODE') ? 'QR Code' : 'Barcode (' + fmt + ')';

  document.getElementById('rVal').textContent = text;
  document.getElementById('rTyp').textContent = typeLabel;
  document.getElementById('resbox').classList.add('show');
  document.getElementById('btns').style.display = 'flex';
  document.getElementById('msg').textContent = '✅ Berhasil!';
  document.getElementById('msg').className = 'msg ok';
  document.getElementById('overlay').style.display = 'none';
}

function showScanError(err) {
  var msg = err.toString();
  var title = '❌ Kamera Error';
  var desc = 'Tidak bisa mengakses kamera.';
  var steps = '';

  if (msg.indexOf('NotAllowed') >= 0 || msg.indexOf('Permission') >= 0) {
    title = '🚫 Izin Ditolak';
    desc = 'Izinkan akses kamera untuk scan.';
    steps = '<div>1. Klik 🔒 di address bar</div>';
    steps += '<div>2. Camera → Allow</div>';
    steps += '<div>3. Klik "Coba Lagi"</div>';
  } else if (msg.indexOf('NotFound') >= 0) {
    title = '📷 Tidak Ada Kamera';
    desc = 'Perangkat tidak punya kamera.';
    steps = '<div>Gunakan HP yang ada kamera</div>';
  } else if (msg.indexOf('NotReadable') >= 0) {
    title = '⚠️ Kamera Sibuk';
    desc = 'Tutup app lain yang pakai kamera.';
    steps = '<div>1. Tutup app/tab lain</div><div>2. Klik "Coba Lagi"</div>';
  } else {
    steps = '<div>1. Pastikan Chrome terbaru</div><div>2. Refresh & coba lagi</div>';
  }

  document.getElementById('erT').textContent = title;
  document.getElementById('erD').textContent = desc;
  document.getElementById('erS').innerHTML = steps;
  document.getElementById('errp').classList.add('show');
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('msg').textContent = '❌ Kamera error';
  document.getElementById('msg').className = 'msg er';
}

function doRetry() {
  lastVal = '';
  startScan();
}

function doRescan() {
  lastVal = '';
  paused = false;
  document.getElementById('resbox').classList.remove('show');
  document.getElementById('btns').style.display = 'none';
  document.getElementById('msg').textContent = '📷 Arahkan ke barcode/QR...';
  document.getElementById('msg').className = 'msg';
  document.getElementById('overlay').style.display = 'block';
  try { scanner.resume(); } catch (e) { startScan(); }
}

// Send result
function sendResult() {
  var value = document.getElementById('rVal').textContent;
  var type = document.getElementById('rTyp').textContent;

  if (window.opener) {
    try {
      window.opener.postMessage({
        source: 'packing-scanner',
        action: 'scan-result',
        target: scanTarget,
        value: value,
        type: type
      }, '*');
      toast('✅ Kode dikirim!');
      stopAll();
      setTimeout(function() { window.close(); }, 800);
      return;
    } catch (e) {}
  }

  // Fallback: copy
  copyVal(value);
}

function copyVal(val) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(function() {
      toast('📋 Disalin! Paste di form.');
      setTimeout(function() { try { window.close(); } catch(e) {} }, 1500);
    }).catch(function() { fbCopy(val); });
  } else {
    fbCopy(val);
  }
}

function fbCopy(val) {
  var ta = document.createElement('textarea');
  ta.value = val;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('📋 Disalin!'); }
  catch (e) { toast('Kode: ' + val); }
  document.body.removeChild(ta);
  setTimeout(function() { try { window.close(); } catch(e) {} }, 2000);
}

function stopAll() {
  paused = true;
  if (scanner) {
    try { scanner.stop().then(function() { scanner.clear(); }).catch(function() {}); }
    catch (e) {}
  }
}

function closePage() {
  stopAll();
  try { window.close(); } catch (e) {}
  setTimeout(function() { window.history.back(); }, 300);
}

// Handle window resize (penting untuk responsive)
var resizeTimer = null;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    // Restart scanner jika sedang aktif dan belum paused
    if (scanner && !paused) {
      try {
        scanner.stop().then(function() {
          try { scanner.clear(); } catch(e) {}
          scanner = null;
          startScan();
        }).catch(function() {
          scanner = null;
          startScan();
        });
      } catch (e) {
        scanner = null;
        startScan();
      }
    }
  }, 500);
});

// Init
window.addEventListener('load', function() {
  startScan();
});

window.addEventListener('beforeunload', function() {
  stopAll();
});
</script>
</body>
</html>
