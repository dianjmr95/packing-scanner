<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ambil Foto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;width:100%;overflow:hidden;background:#0f172a;color:#f1f5f9;font-family:'Segoe UI',system-ui,sans-serif}.app{display:flex;flex-direction:column;height:100%}.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;flex-shrink:0}.bar h1{font-size:.9rem}.xbtn{background:#ef4444;border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.xbtn:active{transform:scale(.9)}.cam{flex:1;position:relative;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}.cam video{width:100%;height:100%;object-fit:cover}.panel{padding:12px 14px;background:#1e293b;flex-shrink:0}.status{text-align:center;font-size:.85rem;color:#94a3b8;margin-bottom:10px}.status.ok{color:#10b981;font-weight:600}.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.btn{padding:12px 20px;border:none;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}.btn:active{transform:scale(.96)}.btn-capture{background:#3b82f6;color:#fff;min-width:140px;justify-content:center}.btn-ok{background:#10b981;color:#fff}.btn-no{background:#64748b;color:#fff}.photo-count{text-align:center;font-size:.82rem;color:#10b981;font-weight:600;margin-bottom:8px}.thumb-row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin-bottom:8px}.thumb{width:50px;height:50px;border-radius:6px;object-fit:cover;border:2px solid #334155;flex-shrink:0}.loading{display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:.9rem;flex-direction:column;gap:12px}.spinner{width:30px;height:30px;border:3px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.errbox{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#0f172a;z-index:10;padding:24px;text-align:center;flex-direction:column;align-items:center;justify-content:center}.errbox.show{display:flex}.errbox .icon{font-size:3rem;margin-bottom:12px}.errbox .title{font-size:1rem;font-weight:700;color:#ef4444;margin-bottom:8px}.errbox .desc{font-size:.85rem;color:#94a3b8;margin-bottom:16px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;font-size:.85rem;display:none;z-index:100}.toast.show{display:block}.shutter{position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;display:none;z-index:5}.shutter.flash{display:block;animation:shutterAnim .2s}@keyframes shutterAnim{from{opacity:.8}to{opacity:0}}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><h1>📸 Ambil Foto</h1><button class="xbtn" onclick="doClose()">✕</button></div>
  <div class="cam"><video id="vid" autoplay muted playsinline></video><canvas id="canvas" style="display:none"></canvas><div class="shutter" id="shutter"></div>
    <div class="errbox" id="errbox"><div class="icon">📷</div><div class="title" id="errT">Error</div><div class="desc" id="errD">-</div><button class="btn btn-capture" onclick="startCam()">🔄 Coba Lagi</button><br><br><button class="btn btn-no" onclick="doClose()">✕ Tutup</button></div>
    <div class="loading" id="loadMsg"><div class="spinner"></div><div>Meminta izin kamera...</div></div></div>
  <div class="panel"><div class="photo-count" id="photoCount"></div><div class="thumb-row" id="thumbRow"></div><div class="status" id="status">Memulai kamera...</div>
    <div class="btns"><button class="btn btn-capture" id="btnCapture" onclick="doCapture()" style="display:none">📸 Ambil Foto</button><button class="btn btn-ok" id="btnSend" onclick="doSend()" style="display:none">✅ Kirim</button><button class="btn btn-no" onclick="doClose()">✕ Tutup</button></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var stream=null,video=document.getElementById('vid'),canvas=document.getElementById('canvas'),ctx=null,capturedPhotos=[];
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},3000)}
function setStatus(m,c){document.getElementById('status').textContent=m;document.getElementById('status').className='status'+(c?' '+c:'')}
function updateCount(){var el=document.getElementById('photoCount');el.textContent=capturedPhotos.length>0?'📸 '+capturedPhotos.length+' foto':'';var row=document.getElementById('thumbRow'),html='';for(var i=0;i<capturedPhotos.length;i++)html+='<img src="'+capturedPhotos[i]+'" class="thumb">';row.innerHTML=html;document.getElementById('btnSend').style.display=capturedPhotos.length>0?'inline-flex':'none'}
function startCam(){document.getElementById('loadMsg').style.display='flex';document.getElementById('errbox').classList.remove('show');video.style.display='none';navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false}).then(function(s){onCamOK(s)}).catch(function(){navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(function(s){onCamOK(s)}).catch(function(err){document.getElementById('loadMsg').style.display='none';document.getElementById('errT').textContent=err.toString().indexOf('NotAllowed')>=0?'🚫 Izin Ditolak':'❌ Error';document.getElementById('errD').textContent=err.toString().indexOf('NotAllowed')>=0?'🔒 → Camera → Allow':err.toString();document.getElementById('errbox').classList.add('show')})})}
function onCamOK(s){stream=s;video.srcObject=s;video.style.display='block';document.getElementById('loadMsg').style.display='none';video.onloadedmetadata=function(){video.play();canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx=canvas.getContext('2d');setStatus('Kamera siap. Klik 📸','');document.getElementById('btnCapture').style.display='inline-flex'}}
function doCapture(){if(!ctx)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);var sh=document.getElementById('shutter');sh.classList.remove('flash');void sh.offsetWidth;sh.classList.add('flash');setTimeout(function(){sh.classList.remove('flash')},200);try{if(navigator.vibrate)navigator.vibrate(50)}catch(e){}capturedPhotos.push(canvas.toDataURL('image/jpeg',0.85));updateCount();setStatus('✅ Foto '+capturedPhotos.length+' diambil!','ok')}
function doSend(){if(!capturedPhotos.length)return;if(window.opener){try{window.opener.postMessage({source:'packing-photo',action:'photo-result',photos:capturedPhotos},'*');showToast('✅ '+capturedPhotos.length+' foto dikirim!');stopCam();setTimeout(function(){window.close()},800);return}catch(e){}}showToast('⚠️ Tidak bisa kirim.')}
function stopCam(){if(stream){try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}stream=null}}
function doClose(){stopCam();try{window.close()}catch(e){}setTimeout(function(){window.history.back()},300)}
window.addEventListener('load',function(){startCam()});window.addEventListener('beforeunload',function(){stopCam()});
</script>
</body>
</html>
